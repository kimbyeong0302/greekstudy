<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>헬라어 퀴즈</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #f4f1ea;
  color: #222;
  min-height: 100vh;
}
.screen { max-width: 480px; margin: 0 auto; padding: 24px 16px 72px; }
.header-row {
  display: flex; align-items: center; justify-content: center;
  position: relative; margin-bottom: 24px;
}
h1 { font-size: 22px; text-align: center; margin: 0; font-weight: 700; }
.bell-wrap { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; }
.bell-btn {
  position: relative; background: none; border: none; cursor: pointer;
  padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #555; transition: background 0.15s;
}
.bell-btn:hover { background: #e8e4dc; }
.bell-btn svg { width: 22px; height: 22px; display: block; }
.bell-badge {
  position: absolute; top: 2px; right: 2px;
  background: #d64545; color: #fff;
  font-size: 10px; font-weight: 700; line-height: 1;
  min-width: 16px; height: 16px; border-radius: 8px;
  display: none; align-items: center; justify-content: center;
  padding: 0 3px; pointer-events: none;
}
.bell-badge.visible { display: flex; }
.updates-panel {
  position: absolute; right: 0; top: calc(100% + 8px);
  width: 300px; max-width: calc(100vw - 32px);
  background: #fff; border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.13);
  z-index: 100; overflow: hidden;
  display: none;
}
.updates-panel.open { display: block; }
.updates-header {
  padding: 14px 16px 10px;
  font-size: 12px; font-weight: 700; color: #aaa;
  letter-spacing: 0.8px; text-transform: uppercase;
  border-bottom: 1px solid #f0ede6;
}
.update-item {
  padding: 12px 16px;
  border-bottom: 1px solid #f7f5f1;
  display: flex; gap: 12px; align-items: flex-start;
}
.update-item:last-child { border-bottom: none; }
.update-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #2e6ed6; flex-shrink: 0; margin-top: 5px;
}
.update-dot.read { background: #ddd; }
.update-date { font-size: 11px; color: #bbb; margin-bottom: 3px; }
.update-text { font-size: 13px; color: #333; line-height: 1.4; }
.menu-card {
  background: #fff; border-radius: 16px; padding: 18px 20px;
  margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
}
.menu-card-title {
  font-size: 11px; font-weight: 700; color: #aaa;
  letter-spacing: 0.8px; text-transform: uppercase; margin: 0 0 12px;
}
.check-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  padding: 2px 0; -webkit-tap-highlight-color: transparent;
}
.check-row input[type="checkbox"] {
  width: 18px; height: 18px; accent-color: #2e6ed6; cursor: pointer; flex-shrink: 0;
}
.week-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; margin-left: 28px; }
.week-chip {
  display: flex; align-items: center; gap: 5px; padding: 6px 12px;
  border-radius: 20px; background: #f0ede6; font-size: 13px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.week-chip input { accent-color: #2e6ed6; width: 13px; height: 13px; cursor: pointer; }
.week-chip.on { background: #eaf1fd; color: #2e6ed6; font-weight: 600; }
.level-row-menu { display: flex; gap: 8px; margin-top: 14px; }
.lv-btn {
  flex: 1; padding: 9px 4px; font-size: 12px; line-height: 1.4;
  border-radius: 10px; border: 1.5px solid #ddd; background: #fff; color: #666; cursor: pointer;
}
.lv-btn.active { border-color: #2e6ed6; background: #eaf1fd; color: #2e6ed6; font-weight: 600; }
.mode-row { display: flex; gap: 8px; }
.mode-btn {
  flex: 1; padding: 10px 4px; font-size: 13px; line-height: 1.4;
  border-radius: 10px; border: 1.5px solid #ddd; background: #fff; color: #666; cursor: pointer;
}
.mode-btn.active { border-color: #2e6ed6; background: #eaf1fd; color: #2e6ed6; font-weight: 700; }
.start-btn {
  width: 100%; padding: 16px; font-size: 16px; font-weight: 700;
  border-radius: 14px; border: none; background: #2e6ed6; color: #fff;
  cursor: pointer; margin-top: 6px;
}
.start-btn:active { opacity: 0.85; }
.menu-err { text-align: center; color: #d64545; font-size: 13px; margin-top: 10px; display: none; }
.status {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 14px; color: #555; margin-bottom: 12px;
}
#scoreEl { font-weight: 600; color: #222; }
#timerEl {
  font-size: 20px; font-weight: 800; color: #2e6ed6;
  width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid #2e6ed6;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: color 0.2s, border-color 0.2s;
}
#timerEl.urgent { color: #d64545; border-color: #d64545; }
#timerEl:empty  { border-color: transparent; }
.q-badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 10px; margin-bottom: 10px; letter-spacing: 0.3px;
}
.q-badge.alpha { background: #f2ecff; color: #7c3aed; }
.q-badge.word  { background: #eaf1fd; color: #2e6ed6; }
.word-card {
  background: #fff; border-radius: 16px; padding: 28px 16px 24px;
  text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  margin-bottom: 18px; min-height: 130px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#wordDisplay { font-weight: 700; word-break: break-word; overflow-wrap: break-word; line-height: 1.3; width: 100%; }
#subDisplay { font-size: 16px; color: #777; margin-top: 6px; }
#subDisplay:empty { display: none; }
#hintText { font-size: 13px; color: #999; margin-top: 10px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices button {
  padding: 13px 8px; font-size: 14px; border-radius: 10px;
  border: 1.5px solid #ddd; background: #fff; cursor: pointer;
  line-height: 1.3; word-break: keep-all; overflow-wrap: break-word;
}
.choices button:active { transform: scale(0.97); }
.choices button.correct { border-color: #2e9e4f; background: #e6f6ea; }
.choices button.wrong   { border-color: #d64545; background: #fdecec; }
#feedbackEl { min-height: 20px; text-align: center; font-size: 14px; margin-top: 14px; }
.correct-text { color: #2e9e4f; }
.wrong-text   { color: #d64545; }
.final { text-align: center; font-size: 15px; font-weight: 700; margin-top: 10px; }
.btn-row { display: flex; justify-content: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.btn-row button {
  padding: 10px 16px; font-size: 13px; border-radius: 10px;
  border: 1.5px solid #ccc; background: #fff; cursor: pointer;
}
#menuBtn  { color: #888; border-color: #e0e0e0; font-size: 12px; }
#retryBtn { display:none; color: #2e9e4f; border-color: #2e9e4f; font-weight: 600; }
.count-line { text-align: center; font-size: 12px; color: #aaa; margin-top: 24px; }
#wrongList { display:none; margin-top: 24px; }
.wl-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: #333; }
.mode-tag {
  display: inline-block; font-size: 12px; font-weight: 600;
  padding: 3px 10px; border-radius: 10px; margin-bottom: 12px;
}
.mode-tag.practice { background: #eaf1fd; color: #2e6ed6; }
.mode-tag.test     { background: #fdf0ec; color: #c2460a; }
.all-correct {
  text-align: center; font-size: 15px; color: #2e9e4f;
  font-weight: 700; background: #e6f6ea; border-radius: 14px; padding: 20px; margin: 0;
}
.wi {
  background: #fff; border-radius: 12px;
  border: 1.5px solid #f0c0c0; padding: 14px 16px; margin-bottom: 10px;
}
.wi-badge { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.wi-badge.alpha { color: #7c3aed; }
.wi-badge.word   { color: #2e6ed6; }
.wi-badge.ending { color: #9c3dd6; }
.wi-q   { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.wi-row { display: flex; gap: 8px; font-size: 13px; margin-top: 4px; align-items: baseline; }
.wi-lbl { color: #aaa; flex-shrink: 0; }
.wi-wrong   { color: #d64545; font-weight: 600; }
.wi-correct { color: #2e9e4f; font-weight: 600; }

/* ── 레슨 스타일 ──────────────────────────────────────── */
.lesson-back-btn {
  position: absolute; left: 0;
  background: none; border: none; cursor: pointer;
  font-size: 13px; color: #888; padding: 6px 0;
  display: flex; align-items: center; gap: 4px;
}
.lesson-back-btn:hover { color: #444; }
.stage-pip-row {
  display: flex; gap: 5px; justify-content: center; margin-bottom: 20px;
}
.stage-pip {
  width: 28px; height: 6px; border-radius: 3px;
  background: #ddd; transition: background .2s;
}
.stage-pip.active { background: #2e6ed6; }
.stage-pip.done   { background: #2e9e4f; }
.lesson-card {
  background: #fff; border-radius: 16px; padding: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px;
}
.lesson-card-title {
  font-size: 11px; font-weight: 700; color: #aaa;
  letter-spacing: .8px; text-transform: uppercase; margin: 0 0 14px;
}
/* observation */
.obs-row {
  display: flex; gap: 14px; justify-content: center;
  flex-wrap: wrap; padding: 8px 0 4px;
}
.obs-item { text-align: center; }
.obs-form {
  font-size: 22px; font-weight: 700; line-height: 1.2;
}
.obs-label { font-size: 11px; color: #999; margin-top: 3px; }
.end-hi { color: #2e6ed6; }
/* paradigm table */
.paradigm-wrap { overflow-x: auto; margin-top: 10px; }
.paradigm-table {
  width: 100%; border-collapse: collapse; font-size: 14px;
}
.paradigm-table th {
  background: #f4f1ea; font-size: 11px; color: #888;
  padding: 7px 8px; font-weight: 600; white-space: nowrap;
}
.paradigm-table td {
  padding: 9px 8px; border-bottom: 1px solid #f0ede6; text-align: center;
}
.paradigm-table tr:last-child td { border-bottom: none; }
.p-form { font-size: 15px; font-weight: 700; }
.p-tr   { font-size: 12px; color: #888; }
/* explanation text */
.exp-text {
  font-size: 14px; line-height: 1.75; color: #444; margin: 0;
}
.exp-em { color: #2e6ed6; font-weight: 700; }
/* stage 2 confirm question */
.s2-q-wrap { margin-top: 14px; }
.s2-q-text {
  font-size: 14px; font-weight: 600; color: #222; margin-bottom: 10px;
}
.s2-opts { display: flex; flex-direction: column; gap: 7px; }
.s2-opt {
  padding: 11px 14px; font-size: 14px;
  border-radius: 10px; border: 1.5px solid #ddd;
  background: #fff; cursor: pointer; text-align: left;
  transition: border-color .15s, background .15s;
}
.s2-opt:hover:not(:disabled) { border-color: #2e6ed6; background: #f5f8ff; }
.s2-opt.correct { border-color: #2e9e4f; background: #e6f6ea; color: #1a6e35; font-weight: 600; }
.s2-opt.wrong   { border-color: #d64545; background: #fdecec; color: #a02020; }
/* lesson nav button */
.lesson-btn {
  width: 100%; padding: 15px; font-size: 15px; font-weight: 700;
  border-radius: 12px; border: none; cursor: pointer; margin-top: 6px;
}
.lesson-btn.primary { background: #2e6ed6; color: #fff; }
.lesson-btn.secondary { background: #fff; color: #666; border: 1.5px solid #ddd; }
.lesson-btn.success { background: #2e9e4f; color: #fff; }
.lesson-btn:active { opacity: .85; }
/* lesson selection */
.ls-week-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 2px 8px; margin-top: 4px;
}
.ls-week-title { font-size: 16px; font-weight: 700; color: #222; }
.ls-week-count { font-size: 12px; color: #aaa; font-weight: 400; margin-left: 5px; }
.ls-week-btn {
  font-size: 12px; padding: 6px 14px; border-radius: 20px;
  border: 1.5px solid #2e6ed6; background: #fff; color: #2e6ed6;
  cursor: pointer; font-weight: 600; white-space: nowrap;
}
.ls-week-btn:active { background: #eaf1fd; }
.ls-week-toggle {
  display: flex; align-items: center; gap: 7px;
  background: none; border: none; padding: 0; cursor: pointer; flex: 1; text-align: left;
}
.ls-week-arrow {
  font-size: 10px; color: #999; transition: transform .2s; display: inline-block;
}
.ls-week-arrow.open { transform: rotate(90deg); }
/* 어형 변화 퀴즈 */
.pq-card { background:#fff;border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.07); }
.pq-card-title { font-size:11px;font-weight:700;color:#aaa;letter-spacing:.8px;text-transform:uppercase;margin:0 0 10px; }
.pq-week-row { display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px; }
.pq-chip { display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;background:#f0ede6;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent; }
.pq-chip input { accent-color:#2e6ed6;width:13px;height:13px;cursor:pointer; }
.pq-chip.on { background:#eaf1fd;color:#2e6ed6;font-weight:600; }
.pq-progress { display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#aaa;margin-bottom:10px; }
.ls-section { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: .8px; text-transform: uppercase; margin: 14px 0 6px; }
.ls-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px; background: #fff;
  margin-bottom: 7px; cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: background .15s;
}
.ls-item:hover { background: #eaf1fd; }
.ls-dict { font-size: 18px; font-weight: 700; min-width: 90px; }
.ls-meaning { font-size: 13px; color: #777; }
.ls-arrow { margin-left: auto; color: #ccc; }
/* grammar btn */
.grammar-btn {
  width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
  border-radius: 12px; border: none; background: #4a3380; color: #fff; cursor: pointer;
}
.grammar-btn:active { opacity: .85; }
/* ── 성·수·격 퀴즈 ─────────────────────────────────────── */
.gnc-start-btn { background: #2e6ed6; margin-top: 14px; }
.gnc-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; background: #eaf1fd; color: #2e6ed6; }
.gnc-wrong-item { background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.gnc-wrong-form { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.gnc-wrong-dict { font-size: 12px; color: #999; font-weight: 400; margin-left: 6px; }
.gnc-wrong-row { font-size: 13px; line-height: 1.6; }
/* ── 암기 카드 ─────────────────────────────────────────── */
.card-start-btn { background: #2e7d6b; margin-top: 14px; }
.fc-top {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 14px; color: #555; margin-bottom: 12px;
}
.flashcard { perspective: 1200px; height: 380px; cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; }
.fc-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform .45s; transform-style: preserve-3d;
}
.fc-inner.no-anim { transition: none; }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; border-radius: 16px; background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 22px 20px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column;
}
.fc-front { align-items: center; justify-content: center; text-align: center; }
.fc-back { transform: rotateY(180deg); overflow-y: auto; }
.fc-week { position: absolute; top: 14px; left: 16px; font-size: 11px; font-weight: 700; color: #2e7d6b; background: #e6f3ef; padding: 3px 9px; border-radius: 10px; }
.fc-star { position: absolute; top: 12px; right: 16px; font-size: 18px; color: #e0a100; }
.fc-greek { font-size: 40px; font-weight: 700; line-height: 1.25; word-break: break-word; }
.fc-pron { font-size: 18px; color: #777; margin-top: 8px; }
.fc-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: #bbb; }
.fc-back-greek { font-size: 15px; color: #999; margin-bottom: 4px; }
.fc-meaning { font-size: 22px; font-weight: 700; margin-bottom: 16px; line-height: 1.35; }
.fc-sec-lbl { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: .8px; margin: 0 0 5px; }
.fc-ety { font-size: 14px; line-height: 1.65; color: #333; margin: 0 0 16px; }
.fc-pun {
  font-size: 14px; line-height: 1.65; color: #6b4e00; margin: 0;
  background: #fff8e6; border: 1.5px dashed #f0d38a; border-radius: 10px; padding: 10px 12px;
}
.fc-none { font-size: 13px; color: #aaa; }
.fc-controls { display: flex; gap: 8px; margin-top: 14px; }
.fc-nav, .fc-mark {
  flex: 1; padding: 13px 4px; font-size: 14px; font-weight: 600;
  border-radius: 12px; border: 1.5px solid #ddd; background: #fff; color: #555; cursor: pointer;
}
.fc-nav:disabled { opacity: .4; cursor: default; }
.fc-mark { flex: 1.3; }
.fc-mark.on { border-color: #e0a100; background: #fff8e6; color: #9a6b00; }
.fc-empty { text-align: center; color: #888; font-size: 14px; padding: 40px 0; }
/* completion notice */
.lesson-done-card {
  background: #fff; border-radius: 16px; padding: 28px 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center;
}
.lesson-done-icon { font-size: 40px; margin-bottom: 12px; }
.lesson-done-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.lesson-done-sub { font-size: 13px; color: #888; line-height: 1.6; }

/* ── 3/4단계 스타일 ─────────────────────────────────────── */
.s34-fields { display: flex; flex-direction: column; }
.s34-field {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid #f0ede6;
}
.s34-field:last-child { border-bottom: none; }
.s34-field-lbl {
  font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase;
  letter-spacing: .4px; min-width: 34px; padding-top: 9px; flex-shrink: 0;
}
.s34-opts { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.s34-opt {
  padding: 7px 11px; font-size: 13px; border-radius: 8px;
  border: 1.5px solid #ddd; background: #fff; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.s34-opt:hover:not(:disabled) { border-color: #2e6ed6; background: #f5f8ff; }
.s34-opt.s34-selected { border-color: #5a3e9e; background: #f0ebff; color: #5a3e9e; font-weight: 600; }
.s34-opt.s34-correct  { border-color: #2e9e4f !important; background: #e6f6ea !important; color: #1a6e35 !important; font-weight: 600; }
.s34-opt.s34-wrong    { border-color: #d64545 !important; background: #fdecec !important; color: #a02020 !important; }
.s34-given {
  flex: 1; padding: 7px 11px; font-size: 13px; font-weight: 600;
  background: #f0ede6; border-radius: 8px; color: #999;
}
.s4-errors { display: flex; flex-direction: column; gap: 8px; }
.s4-err-item {
  background: #fff8f8; border: 1px solid #f2c8c8;
  border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5;
}
.s4-err-label { font-weight: 700; color: #555; }
.s4-wrong-txt { color: #d64545; font-weight: 700; }
.s4-right-txt { color: #2e9e4f; font-weight: 700; }
.s4-expln { font-size: 12px; color: #777; margin-top: 3px; }

/* ── 5/6단계 스타일 ─────────────────────────────────────── */
.s6-sentence {
  font-size: 20px; font-weight: 700; text-align: center;
  margin: 4px 0 0; letter-spacing: .5px; line-height: 1.5;
}
.s6-target-word {
  color: #2e6ed6; background: #eaf1fd;
  border-radius: 4px; padding: 0 3px;
}

</style>
</head>
<body>
<!-- ── 메뉴 화면 ───────────────────────────────────────── -->
<div id="menuScreen" class="screen">
  <div class="header-row">
    <h1>헬라어 퀴즈</h1>
    <div class="bell-wrap">
      <button class="bell-btn" id="bellBtn" aria-label="업데이트 알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

const STORAGE_KEY = 'lastSeenUpdate';
function getLastSeen() { try { return localStorage.getItem(STORAGE_KEY) || ''; } catch { return ''; } }
function setLastSeen(date) { try { localStorage.setItem(STORAGE_KEY, date); } catch {} }
function getUnreadCount() {
  const seen = getLastSeen();
  if (!seen) return updates.length;
  return updates.filter(u => u.date > seen).length;
}

const bellBtn      = document.getElementById('bellBtn');
const bellBadge    = document.getElementById('bellBadge');
const updatesPanel = document.getElementById('updatesPanel');

function renderBadge() {
  const n = getUnreadCount();
  if (n > 0) { bellBadge.textContent = n > 9 ? '9+' : n; bellBadge.classList.add('visible'); }
  else        { bellBadge.classList.remove('visible'); }
}
function renderPanel() {
  const seen = getLastSeen();
  let html = '<div class="updates-header">업데이트 내역</div>';
  updates.forEach(u => {
    const isNew = u.date > seen;
    html += '<div class="update-item">'
      + '<div class="update-dot' + (isNew ? '' : ' read') + '"></div>'
      + '<div><div class="update-date">' + u.date + '</div>'
      + '<div class="update-text">' + u.text + '</div></div></div>';
  });
  updatesPanel.innerHTML = html;
}
bellBtn.addEventListener('click', e => {
  e.stopPropagation();
  const isOpen = updatesPanel.classList.toggle('open');
  if (isOpen) { renderPanel(); if (updates.length > 0) { setLastSeen(updates[0].date); renderBadge(); } }
});
document.addEventListener('click', e => {
  if (!updatesPanel.contains(e.target) && e.target !== bellBtn) updatesPanel.classList.remove('open');
});
renderBadge();

function adjRows(rows) {
  const out = [];
  rows.forEach(([c, n, m, f, nt]) => {
    [['남성', m], ['여성', f], ['중성', nt]].forEach(([g, [form, end]]) => {
      out.push({ form, end, gender: g, case: c, number: n });
    });
  });
  return out;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

  const weeks = [...new Set(words.map(w => w.week))].sort((a,b) => a-b);
  weekChips.innerHTML = weeks.map(wk => {
    const cnt = words.filter(w => w.week === wk).length;
    return `<label class="week-chip on" id="chip${wk}">
      <input type="checkbox" class="wk-cb" value="${wk}" checked>
      ${wk}주차 <span style="opacity:.6;font-weight:400">(${cnt}개)</span>
    </label>`;
  }).join('');
  weekChips.querySelectorAll('.wk-cb').forEach(cb => {
    cb.addEventListener('change', () => cb.closest('.week-chip').classList.toggle('on', cb.checked));
  });
}
buildWeekChips();

function buildEndingChips() {
  const cats = [...new Set(endings.map(e => e.category))];
  endingChips.innerHTML = cats.map(cat => {
    const cnt = endings.filter(e => e.category === cat).length;
    return `<label class="week-chip on">
      <input type="checkbox" class="ending-cat-cb" value="${cat}" checked>
      ${cat} <span style="opacity:.6;font-weight:400">(${cnt}개)</span>
    </label>`;
  }).join('');
  endingChips.querySelectorAll('.ending-cat-cb').forEach(cb => {
    cb.addEventListener('change', () => cb.closest('.week-chip').classList.toggle('on', cb.checked));
  });
}
buildEndingChips();

function showErr(msg) { menuErr.textContent = msg; menuErr.style.display = 'block'; }

function stopTimers() {
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  if (moveTimer)      { clearTimeout(moveTimer);       moveTimer = null; }
  timerEl.textContent = '';
  timerEl.classList.remove('urgent');
}

function launchQuiz(cfg) {
  stopTimers();
  currentMode = cfg.mode;
  let qs = [];
  if (cfg.doAlpha) letters.forEach(lt => qs.push({ type: 'alpha', data: lt }));
  if (cfg.doWord)  words.filter(w => cfg.selWeeks.includes(w.week))
                        .forEach(w => qs.push({ type: 'word', data: w, level: cfg.level }));
  if (cfg.doEnding) {
    endings.filter(e => cfg.selCats.includes(e.category)).forEach(e => {
      qs.push({ type: 'ending', data: e, dir: 'label->ending' });
      qs.push({ type: 'ending', data: e, dir: 'ending->label' });
    });
  }
  quizOrder = shuffle(qs);
  qIdx = 0; score = 0; answered = false; wrongAnswers = [];
  menuScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  window.scrollTo(0, 0);
  renderQuestion();
}

function startQuestionTimer(correctVal, q) {
  let count = 3;
  timerEl.textContent = count;
  timerEl.classList.remove('urgent');
  countdownTimer = setInterval(() => {
    count--;
    if (count > 0) {
      timerEl.textContent = count;
      if (count === 1) timerEl.classList.add('urgent');
    } else {
      clearInterval(countdownTimer); countdownTimer = null;
      if (answered) return;
      answered = true;
      wrongAnswers.push({ q, chosen: '(시간 초과)', correct: correctVal });
      Array.from(choicesEl.children).forEach(c => {
        if (c.textContent === correctVal) c.classList.add('correct');
      });
      feedbackEl.innerHTML = '<span class="wrong-text">시간 초과! 정답: ' + correctVal + '</span>';
      timerEl.textContent = ''; timerEl.classList.remove('urgent');
      scheduleNext();
    }
  }, 1000);
}

function scheduleNext() {
  moveTimer = setTimeout(() => { moveTimer = null; advanceOrEnd(); }, 1000);
}

function advanceOrEnd() {
  if (qIdx < quizOrder.length - 1) {
    qIdx++;
    renderQuestion();
  } else {
    const modeLabel = currentMode === 'test' ? '테스트 모드' : '연습 모드';
    feedbackEl.innerHTML +=
      '<div class="final">퀴즈 종료! 최종 점수: ' + score + ' / ' + quizOrder.length + '</div>';
    retryBtn.style.display = 'inline-block';
    showWrongList(modeLabel);
  }
}

function renderQuestion() {
  stopTimers();
  answered = false;
  feedbackEl.innerHTML = '';
  retryBtn.style.display = 'none';
  wrongListEl.style.display = 'none';
  wrongListEl.innerHTML = '';
  const q = quizOrder[qIdx];
  progressEl.textContent = '문제 ' + (qIdx + 1) + ' / ' + quizOrder.length;
  scoreEl.textContent    = '맞은 개수: ' + score;
  countEl.textContent    = '총 ' + quizOrder.length + '문제';
  if (q.type === 'alpha') renderAlpha(q);
  else if (q.type === 'ending') renderEnding(q);
  else renderWord(q);
}

function renderAlpha(q) {
  const lt = q.data;
  qBadge.textContent = '알파벳'; qBadge.className = 'q-badge alpha'; qBadge.style.color = '';
  wordDisplay.style.fontSize = '52px';
  wordDisplay.textContent = lt.u + '   ' + lt.l;
  subDisplay.textContent = '';
  hintText.textContent = '이 글자의 이름은?';
  const pool = shuffle(letters.filter(x => x.name !== lt.name)).slice(0, 3);
  pool.push(lt);
  buildChoices(shuffle(pool), opt => opt.name, lt.name, q);
}

function renderWord(q) {
  const w = q.data, lv = q.level;
  qBadge.textContent = w.week + '주차 단어'; qBadge.className = 'q-badge word'; qBadge.style.color = '';
  if (lv === 3) {
    wordDisplay.style.fontSize = '22px';
    wordDisplay.textContent = w.ko || w.en;
    subDisplay.textContent = '';
    hintText.textContent = '이 뜻에 해당하는 헬라어 단어는?';
  } else {
    wordDisplay.style.fontSize = '32px';
    wordDisplay.textContent = w.gr;
    subDisplay.textContent = (lv === 1 && w.kr) ? '[' + w.kr + ']' : '';
    hintText.textContent = '이 단어의 뜻은?';
  }
  const matchKey = lv === 3 ? 'gr' : 'en';
  const pool = shuffle(words.filter(x => x[matchKey] !== w[matchKey])).slice(0, 3);
  pool.push(w);
  buildChoices(shuffle(pool), opt => opt[matchKey], w[matchKey], q);
}

function endingLabel(e) {
  return e.type === 'verb' ? e.label : e.gender + ' ' + e.case + ' ' + e.number;
}

function renderEnding(q) {
  const d = q.data;
  const sameCat = endings.filter(e => e.category === d.category);
  qBadge.textContent = '어미 퀴즈'; qBadge.className = 'q-badge';
  qBadge.style.color = '#9c3dd6';

  if (q.dir === 'label->ending') {
    const lbl = endingLabel(d);
    wordDisplay.style.fontSize = d.type === 'verb' ? '28px' : '24px';
    wordDisplay.textContent = lbl;
    subDisplay.textContent = '';
    hintText.textContent = d.type === 'verb'
      ? '이 인칭/수에 해당하는 어미는?'
      : '이 격/수에 해당하는 어미는?';
    if (d.type === 'noun') {
      // unique distractor endings from same category (avoid duplicate ending strings)
      const seen = new Set([d.ending]);
      const distractors = [];
      for (const x of shuffle([...sameCat])) {
        if (!seen.has(x.ending)) { seen.add(x.ending); distractors.push(x); }
        if (distractors.length === 3) break;
      }
      distractors.push(d);
      buildChoices(shuffle(distractors), opt => opt.ending, d.ending, q);
    } else {
      const pool = shuffle(sameCat.filter(x => x.ending !== d.ending)).slice(0, 3);
      pool.push(d);
      buildChoices(shuffle(pool), opt => opt.ending, d.ending, q);
    }
  } else {
    // ending->label
    const correctLbl = endingLabel(d);
    wordDisplay.style.fontSize = '40px';
    wordDisplay.textContent = d.ending;
    subDisplay.textContent = d.type === 'noun' ? d.gender : '';
    hintText.textContent = '이 어미는 무엇을 나타낼까요?';
    // exclude entries sharing the same ending (all technically correct for nouns)
    const pool = shuffle(sameCat.filter(x => x.ending !== d.ending)).slice(0, 3);
    pool.push(d);
    buildChoices(shuffle(pool), opt => endingLabel(opt), correctLbl, q);
  }
}

function buildChoices(opts, getValue, correctVal, q) {
  choicesEl.innerHTML = '';
  opts.forEach(opt => {
    const val = getValue(opt);
    const btn = document.createElement('button');
    btn.textContent = val;
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      if (currentMode === 'test') {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        timerEl.textContent = ''; timerEl.classList.remove('urgent');
      }
      if (val === correctVal) {
        score++;
        btn.classList.add('correct');
        feedbackEl.innerHTML = '<span class="correct-text">정답입니다.</span>';
      } else {
        btn.classList.add('wrong');
        wrongAnswers.push({ q, chosen: val, correct: correctVal });
        feedbackEl.innerHTML = '<span class="wrong-text">오답입니다. 정답: ' + correctVal + '</span>';
      }
      scoreEl.textContent = '맞은 개수: ' + score;
      Array.from(choicesEl.children).forEach(c => {
        if (c.textContent === correctVal && c !== btn) c.classList.add('correct');
      });
      scheduleNext();
    });
    choicesEl.appendChild(btn);
  });
  if (currentMode === 'test') startQuestionTimer(correctVal, q);
}

function showWrongList(modeLabel) {
  wrongListEl.style.display = 'block';
  setTimeout(() => wrongListEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
  let html = '<span class="mode-tag ' + (currentMode === 'test' ? 'test' : 'practice') + '">' + modeLabel + '</span>';
  if (wrongAnswers.length === 0) {
    html += '<p class="all-correct">모두 맞혔습니다! 🎉</p>';
    wrongListEl.innerHTML = html;
    return;
  }
  html += '<p class="wl-title">틀린 문제 목록 (' + wrongAnswers.length + '개)</p>';
  wrongAnswers.forEach(({ q, chosen, correct }) => {
    let badge, qText;
    if (q.type === 'alpha') {
      badge = '<div class="wi-badge alpha">알파벳</div>';
      qText = q.data.u + '  ' + q.data.l;
    } else if (q.type === 'ending') {
      badge = '<div class="wi-badge ending">어미 퀴즈</div>';
      const endLbl = endingLabel(q.data);
      qText = q.dir === 'label->ending'
        ? endLbl + ' 어미는?'
        : '어미 ' + q.data.ending + (q.data.type === 'noun' ? ' (' + q.data.gender + ')' : '') + ' 은(는)?';
    } else {
      const w = q.data, lv = q.level;
      badge = '<div class="wi-badge word">' + w.week + '주차 단어</div>';
      qText = lv === 3
        ? (w.ko || w.en)
        : w.gr + (w.kr ? ' <span style="font-size:13px;font-weight:400;color:#888">[' + w.kr + ']</span>' : '');
    }
    html += '<div class="wi">' + badge +
      '<div class="wi-q">' + qText + '</div>' +
      '<div class="wi-row"><span class="wi-lbl">내 답&nbsp;</span><span class="wi-wrong">' + chosen + '</span></div>' +
      '<div class="wi-row"><span class="wi-lbl">정&nbsp;&nbsp;답&nbsp;</span><span class="wi-correct">' + correct + '</span></div>' +
      '</div>';
  });
  wrongListEl.innerHTML = html;
}

function formWithHi(form, end) {
  const rootLen = form.length - end.length;
  const root = form.slice(0, rootLen);
  return root + '<span class="end-hi">' + end + '</span>';
}

// ── 단계 진행바 HTML
function stagePips(current) {
  // 1~2단계만 표시 (나머지는 준비중)
  let html = '<div class="stage-pip-row">';
  for (let i = 1; i <= 6; i++) {
    let cls = 'stage-pip';
    if (i < current) cls += ' done';
    else if (i === current) cls += ' active';
    html += '<div class="' + cls + '" title="' + i + '단계"></div>';
  }
  html += '</div>';
  return html;
}

// ── 레슨 선택 화면 렌더
function renderLessonSelect() {
  lessonBackBtn.textContent = '← 메뉴';
  // 주차별 그룹화
  const weekMap = {};
  lessonItems.forEach((item, idx) => {
    const wk = item.data.week;
    if (!weekMap[wk]) weekMap[wk] = [];
    weekMap[wk].push({ item, idx });
  });
  const weeks = Object.keys(weekMap).map(Number).sort((a, b) => a - b);
  let html = '<button class="lesson-btn primary" style="margin-bottom:14px" data-action="start-seq">전체 순서대로 시작</button>';
  // 어형 변화 퀴즈 카드
  html += '<div class="pq-card"><div class="pq-card-title">어형 변화 퀴즈</div><div class="pq-week-row">';
  weeks.forEach(wk => {
    const formCnt = weekMap[wk].reduce((s, e) => s + e.item.data.forms.length, 0);
    const isOn = pqSelWeeks.has(wk);
    html += '<label class="pq-chip' + (isOn ? ' on' : '') + '">'
      + '<input type="checkbox" class="pq-wk-cb" data-week="' + wk + '"' + (isOn ? ' checked' : '') + '>'
      + wk + '주차<span style="opacity:.6;font-weight:400;margin-left:3px">(' + formCnt + '형)</span></label>';
  });
  html += '</div>'
    + '<button class="lesson-btn" style="font-size:13px;padding:10px;margin:0" data-action="start-pquiz">헬라어 파싱 퀴즈 →</button>'
    + '</div>';
  weeks.forEach(wk => {
    const entries = weekMap[wk];
    html += '<div class="ls-week-hdr">'
      + '<button class="ls-week-toggle" data-action="toggle-week" data-week="' + wk + '">'
      + '<span class="ls-week-arrow">▶</span>'
      + '<span class="ls-week-title">' + wk + '주차<span class="ls-week-count">(' + entries.length + '개)</span></span>'
      + '</button>'
      + '<button class="ls-week-btn" data-action="start-week" data-week="' + wk + '">이 주차 시작</button>'
      + '</div>'
      + '<div id="ls-body-' + wk + '" hidden>';
    const verbs = entries.filter(e => e.item.type === 'verb');
    const nouns = entries.filter(e => e.item.type === 'noun');
    if (verbs.length) {
      html += '<div class="ls-section">동사 (' + verbs.length + '개)</div>';
      verbs.forEach(({ item: v, idx }) => {
        html += '<div class="ls-item" data-action="start-item" data-idx="' + idx + '">'
          + '<span class="ls-dict">' + v.data.dict + '</span>'
          + '<span class="ls-meaning">' + v.data.meaning + '</span>'
          + '<span class="ls-arrow">›</span></div>';
      });
    }
    if (nouns.length) {
      html += '<div class="ls-section">명사 (' + nouns.length + '개)</div>';
      nouns.forEach(({ item: n, idx }) => {
        html += '<div class="ls-item" data-action="start-item" data-idx="' + idx + '">'
          + '<span class="ls-dict">' + n.data.dict + '</span>'
          + '<span class="ls-meaning">' + n.data.meaning + ' (' + n.data.gender + ')</span>'
          + '<span class="ls-arrow">›</span></div>';
      });
    }
    const adjs = entries.filter(e => e.item.type === 'adj');
    if (adjs.length) {
      html += '<div class="ls-section">형용사·관사 (' + adjs.length + '개)</div>';
      adjs.forEach(({ item: a, idx }) => {
        html += '<div class="ls-item" data-action="start-item" data-idx="' + idx + '">'
          + '<span class="ls-dict">' + a.data.dict + '</span>'
          + '<span class="ls-meaning">' + a.data.meaning + '</span>'
          + '<span class="ls-arrow">›</span></div>';
      });
    }
    html += '</div>';
  });
  lessonContent.innerHTML = html;
}

// ── 이벤트 위임 (lessonContent 전체)
lessonContent.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'toggle-week') {
    const wk = el.dataset.week;
    const body  = document.getElementById('ls-body-' + wk);
    const arrow = el.querySelector('.ls-week-arrow');
    if (body) {
      body.hidden = !body.hidden;
      if (arrow) arrow.classList.toggle('open', !body.hidden);
    }
  } else if (action === 'start-seq') {
    lessonIdx = 0; startLesson();
  } else if (action === 'start-week') {
    const wk = parseInt(el.dataset.week);
    lessonIdx = lessonItems.findIndex(item => item.data.week === wk);
    startLesson();
  } else if (action === 'start-item') {
    lessonIdx = parseInt(el.dataset.idx); startLesson();
  } else if (action === 'to-stage2') {
    lessonStage = 2; s2Answered = false; renderStage2();
  } else if (action === 's2-opt') {
    if (s2Answered) return;
    const chosen = el.dataset.val;
    const item   = lessonItems[lessonIdx];
    const q      = item.data.s2q;
    s2Answered   = true;
    // 모든 버튼 비활성화
    lessonContent.querySelectorAll('[data-action="s2-opt"]').forEach(b => {
      b.disabled = true;
      if (b.dataset.val === q.ans) b.classList.add('correct');
      else if (b.dataset.val === chosen && chosen !== q.ans) b.classList.add('wrong');
    });
    // 결과 피드백 + 다음 버튼 표시
    const fb = document.getElementById('s2Feedback');
    if (chosen === q.ans) {
      fb.innerHTML = '<p style="color:#2e9e4f;font-weight:700;margin:0">정답입니다!</p>';
    } else {
      fb.innerHTML = '<p style="color:#d64545;font-weight:700;margin:0">오답. 정답: ' + q.ans + '</p>';
    }
    document.getElementById('s2DoneBtn').style.display = 'block';
  } else if (action === 's2-done') {
    renderStage3('a');
  } else if (action === 'next-lesson') {
    if (lessonIdx < lessonItems.length - 1) {
      lessonIdx++; startLesson();
    } else {
      lessonIdx = 0; lessonStage = 0; renderLessonSelect();
    }
  } else if (action === 'back-select') {
    lessonStage = 0; renderLessonSelect();

  } else if (action === 'start-pquiz') {
    if (pqSelWeeks.size === 0) return;
    const selItems = lessonItems.filter(item => pqSelWeeks.has(item.data.week));
    pqPool = buildPQPool(selItems);
    pqIdx = 0; pqScore = 0;
    lessonStage = 7;
    renderParadigmQuestion();

  } else if (action === 'pq-select') {
    if (pqSubmitted) return;
    const key = el.dataset.key, val = el.dataset.val;
    lessonContent.querySelectorAll('[data-action="pq-select"][data-key="' + key + '"]').forEach(b => b.classList.remove('s34-selected'));
    el.classList.add('s34-selected');
    pqUserAns[key] = val;
    if (pqCurFields && pqCurFields.every(f => pqUserAns[f.key])) {
      const sb = document.getElementById('pqSubmitBtn');
      if (sb) sb.style.display = 'block';
    }

  } else if (action === 'pq-submit') {
    if (pqSubmitted) return;
    pqSubmitted = true;
    let wrong = [];
    (pqCurFields || []).forEach(field => {
      const chosen = pqUserAns[field.key];
      const extras = field.extras || [];
      const isOk = val => val === field.correct || extras.includes(val);
      const chosenOk = isAnsOk(field, chosen, pqUserAns);
      lessonContent.querySelectorAll('[data-action="pq-select"][data-key="' + field.key + '"]').forEach(b => {
        b.disabled = true;
        if (b.dataset.val === chosen && !chosenOk) b.classList.add('s34-wrong');
        else if (isOk(b.dataset.val)) b.classList.add('s34-correct');
      });
      if (!chosenOk) wrong.push({ field, chosen });
    });
    if (wrong.length === 0) pqScore++;
    const fb = document.getElementById('pqFeedback');
    if (wrong.length === 0) {
      fb.innerHTML = '<p style="color:#2e9e4f;font-weight:700;margin:0">정답!</p>';
    } else {
      let errHtml = '';
      wrong.forEach(({ field, chosen }) => {
        const ex = field.extras || [];
        const disp = field.correct + (ex.length ? ' 또는 ' + ex.join(' 또는 ') : '');
        errHtml += '<div class="s4-err-item"><span class="s4-err-label">[' + field.label + ']</span> '
          + '내 답: <span class="s4-wrong-txt">' + chosen + '</span> → 정답: <span class="s4-right-txt">' + disp + '</span></div>';
      });
      fb.innerHTML = '<div class="s4-errors">' + errHtml + '</div>';
    }
    document.getElementById('pqSubmitBtn').style.display = 'none';
    document.getElementById('pqNextBtn').style.display = 'block';

  } else if (action === 'pq-next') {
    pqIdx++;
    renderParadigmQuestion();

  } else if (action === 'pq-restart') {
    pqPool = buildPQPool(lessonItems.filter(item => pqSelWeeks.has(item.data.week)));
    pqIdx = 0; pqScore = 0;
    renderParadigmQuestion();

  } else if (action === 's34-select') {
    if (s34Submitted) return;
    const key = el.dataset.key;
    const val = el.dataset.val;
    lessonContent.querySelectorAll('[data-action="s34-select"][data-key="' + key + '"]').forEach(b => b.classList.remove('s34-selected'));
    el.classList.add('s34-selected');
    s34UserAns[key] = val;
    const itm = lessonItems[lessonIdx];
    const ak  = lessonStage === 4 ? s34Fields.map(f => f.key) : getActiveKeys(itm, s34Sub);
    if (ak.every(k => s34UserAns[k])) {
      const sb = document.getElementById('s34SubmitBtn');
      if (sb) sb.style.display = 'block';
    }

  } else if (action === 's34-submit') {
    if (s34Submitted) return;
    s34Submitted = true;
    const itm = lessonItems[lessonIdx];
    const ak  = lessonStage === 4 ? s34Fields.map(f => f.key) : getActiveKeys(itm, s34Sub);
    let wrong = [];
    ak.forEach(key => {
      const field  = s34Fields.find(f => f.key === key);
      const chosen = s34UserAns[key];
      const extras = field.extras || [];
      const isCorrect = val => val === field.correct || extras.includes(val);
      const chosenOk = isAnsOk(field, chosen, s34UserAns);
      lessonContent.querySelectorAll('[data-action="s34-select"][data-key="' + key + '"]').forEach(b => {
        b.disabled = true;
        if (b.dataset.val === chosen && !chosenOk) b.classList.add('s34-wrong');
        else if (isCorrect(b.dataset.val)) b.classList.add('s34-correct');
      });
      if (!chosenOk) wrong.push({ field, chosen });
    });
    const fb = document.getElementById('s34Feedback');
    if (wrong.length === 0) {
      fb.innerHTML = '<p style="color:#2e9e4f;font-weight:700;margin:0 0 4px">모두 정확해요!</p>';
    } else if (lessonStage === 4) {
      let errHtml = '';
      wrong.forEach(({ field, chosen }) => {
        const extras = field.extras || [];
        const correctDisplay = field.correct + (extras.length ? ' 또는 ' + extras.join(' 또는 ') : '');
        errHtml += '<div class="s4-err-item">'
          + '<span class="s4-err-label">[' + field.label + ']</span> '
          + '내가 고른 답: <span class="s4-wrong-txt">' + chosen + '</span>'
          + ' → 정답: <span class="s4-right-txt">' + correctDisplay + '</span>'
          + '<div class="s4-expln">' + field.expln + '</div></div>';
      });
      fb.innerHTML = '<div class="s4-errors">' + errHtml + '</div>';
    } else {
      fb.innerHTML = '<p style="color:#d64545;font-weight:700;margin:0 0 4px">' + wrong.length + '개 틀렸어요. 정답을 확인하세요.</p>';
    }
    const sb = document.getElementById('s34SubmitBtn');
    if (sb) sb.style.display = 'none';
    const nb = document.getElementById('s34NextBtn');
    if (nb) nb.style.display = 'block';

  } else if (action === 's34-next') {
    if (lessonStage === 3) {
      if (s34Sub === 'a')      renderStage3('b');
      else if (s34Sub === 'b') renderStage3('c');
      else                     renderStage4();
    } else {
      renderStage5('a');
    }

  } else if (action === 's5-select') {
    if (s5Submitted) return;
    const key = el.dataset.key, val = el.dataset.val;
    lessonContent.querySelectorAll('[data-action="s5-select"][data-key="' + key + '"]').forEach(b => b.classList.remove('s34-selected'));
    el.classList.add('s34-selected');
    s5UserAns[key] = val;
    const allAk = [...(s5VerbFields||[]).filter(f=>f.active).map(f=>f.key),
                   ...(s5NounFields||[]).filter(f=>f.active).map(f=>f.key)];
    if (allAk.length > 0 && allAk.every(k => s5UserAns[k])) {
      const sb = document.getElementById('s5SubmitBtn');
      if (sb) sb.style.display = 'block';
    }

  } else if (action === 's5-submit') {
    if (s5Submitted) return;
    s5Submitted = true;
    const allFields = [...(s5VerbFields||[]), ...(s5NounFields||[])];
    const activeKeys = allFields.filter(f=>f.active).map(f=>f.key);
    let wrong = [];
    activeKeys.forEach(key => {
      const field = allFields.find(f => f.key === key);
      const chosen = s5UserAns[key];
      const extras = field.extras || [];
      const isCorrect = val => val === field.correct || extras.includes(val);
      const chosenOk = isAnsOk(field, chosen, s5UserAns);
      lessonContent.querySelectorAll('[data-action="s5-select"][data-key="' + key + '"]').forEach(b => {
        b.disabled = true;
        if (b.dataset.val === chosen && !chosenOk) b.classList.add('s34-wrong');
        else if (isCorrect(b.dataset.val)) b.classList.add('s34-correct');
      });
      if (!chosenOk) wrong.push({ field, chosen });
    });
    const fb = document.getElementById('s5Feedback');
    if (wrong.length === 0) {
      fb.innerHTML = '<p style="color:#2e9e4f;font-weight:700;margin:0 0 4px">모두 정확해요!</p>';
    } else {
      let errHtml = '';
      wrong.forEach(({ field, chosen }) => {
        const extras = field.extras || [];
        const correctDisplay = field.correct + (extras.length ? ' 또는 ' + extras.join(' 또는 ') : '');
        errHtml += '<div class="s4-err-item">'
          + '<span class="s4-err-label">[' + field.label + ']</span> '
          + '내가 고른 답: <span class="s4-wrong-txt">' + chosen + '</span>'
          + ' → 정답: <span class="s4-right-txt">' + correctDisplay + '</span>'
          + '<div class="s4-expln">' + field.expln + '</div></div>';
      });
      fb.innerHTML = '<div class="s4-errors">' + errHtml + '</div>';
    }
    document.getElementById('s5SubmitBtn').style.display = 'none';
    document.getElementById('s5NextBtn').style.display = 'block';

  } else if (action === 's5-next') {
    const cur = lessonItems[lessonIdx];
    if (s5Sub === 'a' && cur.data.kind !== 'article') renderStage5('b');
    else renderStage6();

  } else if (action === 's6-select') {
    if (s6Submitted) return;
    const key = el.dataset.key, val = el.dataset.val;
    lessonContent.querySelectorAll('[data-action="s6-select"][data-key="' + key + '"]').forEach(b => b.classList.remove('s34-selected'));
    el.classList.add('s34-selected');
    s6UserAns[key] = val;
    if (s6Fields && s6Fields.every(f => s6UserAns[f.key])) {
      const sb = document.getElementById('s6SubmitBtn');
      if (sb) sb.style.display = 'block';
    }

  } else if (action === 's6-submit') {
    if (s6Submitted) return;
    s6Submitted = true;
    let wrong = [];
    (s6Fields||[]).forEach(field => {
      const chosen = s6UserAns[field.key];
      const extras = field.extras || [];
      const isCorrect = val => val === field.correct || extras.includes(val);
      const chosenOk = isAnsOk(field, chosen, s6UserAns);
      lessonContent.querySelectorAll('[data-action="s6-select"][data-key="' + field.key + '"]').forEach(b => {
        b.disabled = true;
        if (b.dataset.val === chosen && !chosenOk) b.classList.add('s34-wrong');
        else if (isCorrect(b.dataset.val)) b.classList.add('s34-correct');
      });
      if (!chosenOk) wrong.push({ field, chosen });
    });
    const fb = document.getElementById('s6Feedback');
    if (wrong.length === 0) {
      fb.innerHTML = '<p style="color:#2e9e4f;font-weight:700;margin:0 0 4px">모두 정확해요!</p>';
    } else {
      let errHtml = '';
      wrong.forEach(({ field, chosen }) => {
        const extras = field.extras || [];
        const correctDisplay = field.correct + (extras.length ? ' 또는 ' + extras.join(' 또는 ') : '');
        errHtml += '<div class="s4-err-item">'
          + '<span class="s4-err-label">[' + field.label + ']</span> '
          + '내가 고른 답: <span class="s4-wrong-txt">' + chosen + '</span>'
          + ' → 정답: <span class="s4-right-txt">' + correctDisplay + '</span>'
          + '<div class="s4-expln">' + field.expln + '</div></div>';
      });
      fb.innerHTML = '<div class="s4-errors">' + errHtml + '</div>';
    }
    document.getElementById('s6SubmitBtn').style.display = 'none';
    document.getElementById('s6NextBtn').style.display = 'block';
    document.getElementById('s6Translation').hidden = false;

  } else if (action === 's6-next') {
    renderLessonDone();

  } else if (action === 'all-done') {
    renderAllDone();
  }
});

function startLesson() {
  lessonStage = 1;
  lessonBackBtn.textContent = '← 목록';
  renderStage1();
}

// ── STAGE 1: 관찰 ──────────────────────────────────────────
function renderStage1() {
  const item = lessonItems[lessonIdx];
  const d    = item.data;
  const isVerb = item.type === 'verb';

  // 관찰용 폼 3개 선택
  let obsForms;
  const isAdj = item.type === 'adj';
  if (isVerb) {
    // 1sg / 2sg / 1pl  → 어미 변화가 잘 보임
    obsForms = [d.forms[0], d.forms[1], d.forms[3]];
  } else if (isAdj) {
    // 남성/여성/중성 주격 단수 → 성에 따른 어미 변화
    obsForms = [d.forms[0], d.forms[1], d.forms[2]];
  } else {
    // 주격sg / 속격sg / 대격sg  → 격 어미 변화
    obsForms = [d.forms[0], d.forms[1], d.forms[3]];
  }

  let obsHtml = '<div class="obs-row">';
  obsForms.forEach(f => {
    const label = isVerb
      ? f.person + '인칭 ' + f.number
      : (isAdj ? f.gender + ' ' : '') + f.case + ' ' + f.number;
    obsHtml += '<div class="obs-item">'
      + '<div class="obs-form">' + formWithHi(f.form, f.end) + '</div>'
      + '<div class="obs-label">' + label + '</div>'
      + '</div>';
  });
  obsHtml += '</div>';

  let hint = isVerb
    ? '파란색 부분이 <strong>인칭 어미</strong>예요. 형태마다 어떻게 달라지는지 살펴보세요.'
    : isAdj
    ? '파란색 부분이 <strong>어미</strong>예요. 같은 격·수라도 <strong>성</strong>에 따라 어떻게 달라지는지 살펴보세요.'
    : '파란색 부분이 <strong>격 어미</strong>예요. 격마다 어떻게 달라지는지 살펴보세요.';

  lessonContent.innerHTML =
    stagePips(1)
    + '<p style="text-align:center;font-size:13px;color:#888;margin:0 0 4px">1단계 · 관찰</p>'
    + '<p style="text-align:center;font-size:20px;font-weight:700;margin:0 0 18px">'
      + d.dict + ' <span style="font-size:14px;color:#888;font-weight:400">— ' + d.meaning + '</span></p>'
    + '<div class="lesson-card">'
      + '<div class="lesson-card-title">형태 비교</div>'
      + obsHtml
      + '<p style="font-size:13px;color:#666;margin:14px 0 0;line-height:1.6">' + hint + '</p>'
    + '</div>'
    + '<button class="lesson-btn primary" data-action="to-stage2">알아챘어요 →</button>';
}

// ── STAGE 2: 이해 ──────────────────────────────────────────
function renderStage2() {
  const item   = lessonItems[lessonIdx];
  const d      = item.data;
  const isVerb = item.type === 'verb';
  if (item.type === 'adj') { renderStage2Adj(d); return; }

  // 변화표 HTML
  let tableHtml = '<div class="paradigm-wrap"><table class="paradigm-table">';
  if (isVerb) {
    tableHtml += '<tr><th>인칭·수</th><th>형태</th><th>직역</th></tr>';
    d.forms.forEach(f => {
      tableHtml += '<tr>'
        + '<td>' + f.person + '인칭 ' + f.number + '</td>'
        + '<td class="p-form">' + formWithHi(f.form, f.end) + '</td>'
        + '<td class="p-tr">' + f.tr + '</td>'
        + '</tr>';
    });
  } else {
    tableHtml += '<tr><th>격</th><th>단수</th><th>복수</th></tr>';
    const cases = ['주격','속격','여격','대격'];
    cases.forEach(c => {
      const sg = d.forms.find(f => f.case === c && f.number === '단수');
      const pl = d.forms.find(f => f.case === c && f.number === '복수');
      tableHtml += '<tr>'
        + '<td style="font-weight:600;color:#555">' + c + '</td>'
        + '<td class="p-form">' + formWithHi(sg.form, sg.end) + '</td>'
        + '<td class="p-form">' + formWithHi(pl.form, pl.end) + '</td>'
        + '</tr>';
    });
  }
  tableHtml += '</table></div>';

  // 설명 문단
  let expHtml;
  if (isVerb) {
    const root = d.forms[0].form.slice(0, d.forms[0].form.length - d.forms[0].end.length);
    expHtml = '<p class="exp-text">'
      + '이 동사의 어근은 <span class="exp-em">' + root + '-</span>이에요. '
      + '어근 뒤에 붙는 <span class="exp-em">어미</span>가 인칭과 수를 나타내요.<br><br>'
      + '단수 어미: <span class="exp-em">-ω</span>(1인칭) / <span class="exp-em">-εις</span>(2인칭) / <span class="exp-em">-ει</span>(3인칭)<br>'
      + '복수 어미: <span class="exp-em">-ομεν</span>(1인칭) / <span class="exp-em">-ετε</span>(2인칭) / <span class="exp-em">-ουσι</span>(3인칭)<br><br>'
      + '복수 어미는 단수 어미와 완전히 다른 세트예요. 특히 복수 1인칭 <span class="exp-em">-ομεν</span>(우리), 2인칭 <span class="exp-em">-ετε</span>(너희), 3인칭 <span class="exp-em">-ουσι</span>(그들)을 함께 외워두면 좋아요.'
      + '</p>';
  } else {
    const isMasc = d.gender === '남성';
    const sg0 = d.forms[0];
    const stem = sg0.form.slice(0, sg0.form.length - sg0.end.length);
    expHtml = '<p class="exp-text">'
      + '이 명사의 어간은 <span class="exp-em">' + stem + '-</span>이에요. '
      + '어간 뒤에 붙는 <span class="exp-em">격 어미</span>가 격과 수를 나타내요. '
      + '이 명사의 성은 <span class="exp-em">' + d.gender + '</span>으로, 외울 때 성도 함께 외워야 해요.<br><br>';
    if (d.gender === '여성') {
      // 1격 변화: η형(γραφή) / α형(ὥρα 등, 어간이 ε·ι·ρ로 끝남) / 혼합형(δόξα, 단수 속격·여격만 η)
      const nomEta = /[ηήῆ]$/.test(sg0.end);
      const genEta = /[ηήῆ]/.test(d.forms[1].end);
      const plural = '<span class="exp-em">-αι</span>(주격) / <span class="exp-em">-ῶν</span>(속격) / <span class="exp-em">-αις</span>(여격) / <span class="exp-em">-ας</span>(대격)';
      if (nomEta) {
        expHtml += '주격 단수가 <span class="exp-em">-η</span>인 명사는 단수 내내 η를 가져요.<br>'
          + '단수 어미: <span class="exp-em">-η</span>(주격) / <span class="exp-em">-ης</span>(속격) / <span class="exp-em">-ῃ</span>(여격) / <span class="exp-em">-ην</span>(대격)<br>'
          + '복수 어미: ' + plural + '<br><br>'
          + '제1변화의 <strong>복수 어미는 모든 명사가 똑같아요.</strong>';
      } else if (genEta) {
        expHtml += '주격 단수가 <span class="exp-em">-α</span>로 끝나도 어간이 ε, ι, ρ 이외의 글자로 끝나면 <strong>단수 속격·여격의 α가 η로</strong> 바뀌어요.<br>'
          + '단수 어미: <span class="exp-em">-α</span>(주격) / <span class="exp-em">-ης</span>(속격) / <span class="exp-em">-ῃ</span>(여격) / <span class="exp-em">-αν</span>(대격)<br>'
          + '복수 어미: ' + plural;
      } else {
        expHtml += '어간이 ε, ι, ρ로 끝나서 단수 내내 α를 가져요.<br>'
          + '단수 어미: <span class="exp-em">-α</span>(주격) / <span class="exp-em">-ας</span>(속격) / <span class="exp-em">-ᾳ</span>(여격) / <span class="exp-em">-αν</span>(대격)<br>'
          + '복수 어미: ' + plural + '<br><br>'
          + '<strong>속격 단수와 대격 복수가 같은 형태(-ας)</strong>라서 문맥으로 구별해야 해요.';
      }
      expHtml += '<br><br>주격 단수가 -α 또는 -η로 끝나는 제1변화 명사는 모두 <strong>여성</strong>이에요. '
        + '복수 속격은 단수 주격의 악센트와 상관없이 항상 <span class="exp-em">-ῶν</span>(얼티마에 써컴플렉스)이에요.';
    } else if (isMasc) {
      expHtml += '단수 어미: <span class="exp-em">-ος</span>(주격) / <span class="exp-em">-ου</span>(속격) / <span class="exp-em">-ῳ</span>(여격) / <span class="exp-em">-ον</span>(대격)<br>'

// ── 형용사·관사 헬퍼
// 문장 속에서 뒤에 다른 낱말이 오면 얼티마의 애큐트가 그레이브로 바뀐다 (ἀγαθός → ἀγαθὸς)
const ACUTE_TO_GRAVE = { 'ά':'ὰ','έ':'ὲ','ή':'ὴ','ί':'ὶ','ό':'ὸ','ύ':'ὺ','ώ':'ὼ','ᾴ':'ᾲ','ῄ':'ῂ','ῴ':'ῲ' };
const GRAVE_TO_ACUTE = Object.fromEntries(Object.entries(ACUTE_TO_GRAVE).map(([a, g]) => [g, a]));
const GREEK_VOWELS = /[αεηιουωάέήίόύώὰὲὴὶὸὺὼᾳῃῳᾴῄῴᾶῆῖῦῶᾷῇῷἀ-ἇἐ-ἕἠ-ἧἰ-ἷὀ-ὅὐ-ὗὠ-ὧᾀ-ᾯ]/;
function toGrave(word) {
  const chars = [...word];
  for (let i = chars.length - 1; i >= 0; i--) {
    if (ACUTE_TO_GRAVE[chars[i]]) {
      // 뒤에 모음이 더 있으면(ι·υ 이중모음 제외) 얼티마가 아님
      const rest = chars.slice(i + 1).join('').replace(/^[ιυ]/, '');
      if (GREEK_VOWELS.test(rest)) return word;
      chars[i] = ACUTE_TO_GRAVE[chars[i]];
      return chars.join('');
    }
  }
  return word;
}
function phrase(words) {
  return words.map((w, i) => i < words.length - 1 ? toGrave(w) : w).join(' ');
}
// 그레이브/애큐트, 문장부호를 무시하고 비교
function normWord(w) {
  return [...w.replace(/[.,·;:]/g, '')].map(ch => GRAVE_TO_ACUTE[ch] || ch).join('');
}
// 문장에서 target 낱말(첫 번째)을 강조
function highlightWord(gr, form) {
  const target = normWord(form);
  let done = false;
  return gr.split(' ').map(tok => {
    if (done || normWord(tok) !== target) return tok;
    done = true;
    const m = tok.match(/^(.*?)([.,·;:]*)$/);
    return '<span class="s6-target-word">' + m[1] + '</span>' + m[2];
  }).join(' ');
}
function josaEunNeun(word) {
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  return word + (code >= 0 && code <= 11171 && code % 28 !== 0 ? '은' : '는');
}
// 성·수·격 일치 명사 선택지: 정답(들) + 다른 성·격·수의 명사 형태
function agreeOpts(correctSet) {
  const pool = [];
  Object.values(AGREE_NOUNS).forEach(dict => {
    nounParadigms.find(n => n.dict === dict).forms.forEach(f => {
      if (!correctSet.includes(f.form) && !pool.includes(f.form)) pool.push(f.form);
    });
  });
  return shuffle(pool).slice(0, 3);
}
function buildAdjFields(d, form, keys, withAgree) {
  const rds = getFormReadings(d, form);
  const fields = [
    withReadings({ key:keys.gender, label:'성', correct: form.gender, opts: ['남성','여성','중성'],
      expln: '어미 -' + form.end + '는 ' + form.gender + ' ' + form.case + ' ' + form.number + '예요.' + readingsNote(d, rds) }, rds, 'gender', keys),
    withReadings({ key:keys.number, label:'수', correct: form.number, opts: ['단수','복수'],
      expln: '어미 -' + form.end + '는 ' + form.number + '를 나타내요.' + readingsNote(d, rds) }, rds, 'number', keys),
    withReadings({ key:keys.case, label:'격', correct: form.case, opts: shuffle(['주격','속격','여격','대격']),
      expln: '어미 -' + form.end + '는 ' + form.case + ' ' + form.number + '를 나타내요.' + readingsNote(d, rds) }, rds, 'case', keys)
  ];
  if (withAgree) {
    const correctSet = rds ? [...new Set(rds.map(r => r.agree))] : [form.agree];
    fields.push(withReadings({ key:keys.agree, label:'일치 명사', correct: form.agree,
      opts: shuffle([...correctSet, ...agreeOpts(correctSet)]),
      expln: (d.kind === 'article' ? '관사' : '형용사') + '는 꾸미는 명사와 성·수·격이 일치해요. '
        + form.form + ' → ' + correctSet.join(' / ') }, rds, 'agree', keys));
  }
  return fields;
}

// ── STAGE 3/4 헬퍼 ───────────────────────────────────────────
// 같은 형태가 여러 격·수로 읽히는 경우 (중성 주격=대격, 여성 α형 속격 단수=대격 복수 등)
// → 가능한 모든 읽기를 정답으로 허용하되, 격·수·직역 조합이 서로 맞아야 정답
// 문맥 없이 형태만 보여줄 때는 같은 형태 중 변화표에서 먼저 나오는 읽기(주격 등)를 기본 정답으로
// (예: 중성 δῶρον → 대격 '선물을'이 아니라 주격 '선물이')
function canonicalForm(par, form) {
  return par.forms.find(f => f.form === form.form) || form;
}
function getFormReadings(par, form) {
  const rs = par.forms.filter(f => f.form === form.form);
  return rs.length > 1 ? rs : null;
}
// field에 extras(대체 정답)와 조합 검사용 정보를 붙인다
// rk: 이 필드가 읽기의 어느 속성인지(case|number|tr), keys: {case,number,tr} → 필드 key
function withReadings(field, readings, rk, keys) {
  if (!readings) return field;
  field.extras   = [...new Set(readings.map(r => r[rk]).filter(v => v !== field.correct))];
  field.readings = readings;
  field.rk       = rk;
  field.rkeys    = keys;
  return field;
}
function readingsNote(par, readings) {
  if (!readings) return '';
  if (par.gender === '중성') return ' (중성 명사는 주격과 대격의 형태가 같아요.)';
  return ' (' + readings[0].form + '는 ' + readings.map(r => (r.gender ? r.gender + ' ' : '') + r.case + ' ' + r.number).join('·') + '의 형태가 같아요.)';
}
// 선택한 답이 정답인지: 대체 정답이면 다른 필드에서 고른 답과 같은 읽기여야 한다
function isAnsOk(field, val, ans) {
  if (val !== field.correct && !(field.extras || []).includes(val)) return false;
  if (!field.readings) return true;
  // 고른 답들과 가장 많이 들어맞는 읽기를 기준으로 판정한다.
  // 예) δῶρον 대격+"선물이": 주격 읽기·대격 읽기가 동점 → 둘 다에 맞는 '수'만 정답, 격·해석은 오답
  //     ὥρας 속격+복수+"시간의": 속격 단수 읽기가 가장 잘 맞음 → '수'만 오답
  const keys  = Object.keys(field.rkeys).filter(rk => ans[field.rkeys[rk]] !== undefined || rk === field.rk);
  const score = r => keys.filter(rk => r[rk] === (rk === field.rk ? val : ans[field.rkeys[rk]])).length;
  const best  = Math.max(...field.readings.map(score));
  return field.readings.filter(r => score(r) === best).every(r => r[field.rk] === val);
}
// 화면에 정답으로 보여준 칸(비활성)이 있으면 그 값과 맞는 읽기만 정답으로 남긴다
// (예: 해석이 "선물들이"로 주어졌으면 격은 주격만 정답)
function fixGivenReadings(fields, isGiven) {
  const given = fields.filter(f => isGiven(f) && f.readings);
  if (!given.length) return;
  fields.forEach(f => {
    if (!f.readings) return;
    const rs = f.readings.filter(r => given.every(g => r[g.rk] === g.correct));
    f.readings = rs.length > 1 ? rs : null;
    f.extras   = f.readings ? [...new Set(rs.map(r => r[f.rk]).filter(v => v !== f.correct))] : [];
  });
}

function buildFields(item, form) {
  const d = item.data, isVerb = item.type === 'verb';
  if (item.type === 'adj') {
    return buildAdjFields(d, form, { gender:'gender', case:'case', number:'number', agree:'agree' }, true);
  }
  if (isVerb) {
    const trWrong = [...new Set(d.forms.map(f => f.tr).filter(t => t !== form.tr))];
    const trOpts  = shuffle([...shuffle(trWrong).slice(0, 3), form.tr]);
    return [
      { key:'tense',  label:'시제', correct: d.tense,
        opts: shuffle(['현재','미완료','부정과거']),
        expln: '이 동사는 현재 시제예요.' },
      { key:'voice',  label:'태',   correct: d.voice,
        opts: shuffle(['능동','중간태','수동']),
        expln: '능동태는 주어가 직접 행동을 수행하는 형태예요.' },
      { key:'mood',   label:'법',   correct: d.mood,
        opts: shuffle(['직설법','가정법','명령법']),
        expln: '직설법은 실제 사실을 단순히 서술하는 법이에요.' },
      { key:'person', label:'인칭', correct: form.person + '인칭',
        opts: shuffle(['1인칭','2인칭','3인칭']),
        expln: '어미 -' + form.end + '는 ' + form.person + '인칭을 나타내요.' },
      { key:'number', label:'수',   correct: form.number,
        opts: ['단수','복수'],
        expln: '어미 -' + form.end + '는 ' + form.number + '를 나타내요.' },
      { key:'tr',     label:'직역', correct: form.tr,
        opts: trOpts,
        expln: '이 형태(' + form.form + ')의 의미는 "' + form.tr + '"이에요.' }
    ];
  } else {
    const trWrong = [...new Set(d.forms.map(f => f.tr).filter(t => t !== form.tr))];
    const trOpts  = shuffle([...shuffle(trWrong).slice(0, 3), form.tr]);
    const rds  = getFormReadings(d, form);
    const keys = { case:'case', number:'number', tr:'tr' };
    return [
      { key:'gender', label:'성',   correct: d.gender,
        opts: shuffle(['남성','여성','중성']),
        expln: '이 명사는 ' + d.gender + '이에요. 사전형과 함께 외워야 해요.' },
      withReadings({ key:'number', label:'수',   correct: form.number,
        opts: ['단수','복수'],
        expln: '어미 -' + form.end + '는 ' + form.number + '를 나타내요.'
             + (rds && rds.some(r => r.number !== form.number) ? readingsNote(d, rds) : '') }, rds, 'number', keys),
      withReadings({ key:'case',   label:'격',   correct: form.case,
        opts: shuffle(['주격','속격','여격','대격']),
        expln: '어미 -' + form.end + '는 ' + form.case + ' ' + form.number + '를 나타내요.'
             + readingsNote(d, rds) }, rds, 'case', keys),
      withReadings({ key:'tr',     label:'직역', correct: form.tr,
        opts: trOpts,
        expln: '이 형태(' + form.form + ')의 의미는 "' + form.tr + '"이에요.' }, rds, 'tr', keys)
    ];
  }
}

function getActiveKeys(item, sub) {
  const isVerb = item.type === 'verb';
  if (item.type === 'adj') {
    if (sub === 'a') return ['gender', 'number'];
    if (sub === 'b') return ['gender', 'number', 'case'];
    return ['gender', 'number', 'case', 'agree'];
  }
  if (isVerb) {
    if (sub === 'a') return ['person', 'number'];
    if (sub === 'b') return ['person', 'number', 'tr'];
    return ['tense', 'voice', 'mood', 'person', 'number', 'tr'];
  } else {
    if (sub === 'a') return ['number', 'case'];
    if (sub === 'b') return ['gender', 'number', 'case'];
    return ['gender', 'number', 'case', 'tr'];
  }
}

function pickFormForSub(item, sub) {
  const forms = item.data.forms;
  const idx = sub === 'a' ? 0
            : sub === 'b' ? Math.floor(forms.length / 2)
            : forms.length - 1;
  return forms[idx];
}

// ── STAGE 3: 따라하기 ─────────────────────────────────────
function renderStage3(sub) {
  lessonStage = 3;
  s34Sub = sub;
  const item = lessonItems[lessonIdx];
  s34Form   = canonicalForm(item.data, pickFormForSub(item, sub));
  s34Fields = buildFields(item, s34Form);
  s34UserAns   = {};
  s34Submitted = false;
  lessonBackBtn.textContent = '← 목록';
  const givenKeys = getActiveKeys(item, sub);
  fixGivenReadings(s34Fields, f => !givenKeys.includes(f.key) && f.key !== 'agree');

  const subLabel = sub === 'a' ? '핵심 2항목' : sub === 'b' ? '주요 항목' : '전체 항목';
  const activeKeys = getActiveKeys(item, sub);
  const isVerb = item.type === 'verb';

  let html = stagePips(3)
    + '<p style="text-align:center;font-size:13px;color:#888;margin:0 0 4px">3단계 · 따라하기 (' + subLabel + ')</p>'
    + '<p style="text-align:center;font-size:20px;font-weight:700;margin:0 0 18px">'
      + item.data.dict
      + ' <span style="font-size:14px;color:#888;font-weight:400">— ' + item.data.meaning + '</span></p>'
    + '<div class="lesson-card">'
      + '<div class="lesson-card-title">이 형태를 분석하세요</div>'

  s34Fields.forEach(field => {
    const isActive = activeKeys.includes(field.key);

    html += '<div class="s34-field">'
      + '<div class="s34-field-lbl">' + field.label + '</div>';
    if (isActive) {
      html += '<div class="s34-opts">';

        html += '<button class="s34-opt" data-action="s34-select" data-key="'
          + field.key + '" data-val="' + opt + '">' + opt + '</button>';
      });
      html += '</div>';
    } else {
      html += '<div class="s34-given">' + field.correct + '</div>';
    }
    html += '</div>';
  });

  const nextLabel = sub === 'c' ? '4단계 회상으로 →' : '다음 →';
  html += '</div>'
    + '<div id="s34Feedback" style="margin-top:12px"></div>'
    + '<button class="lesson-btn primary" id="s34SubmitBtn" data-action="s34-submit"'
      + ' style="display:none;margin-top:14px">확인</button>'
    + '<button class="lesson-btn success" id="s34NextBtn" data-action="s34-next"'
      + ' style="display:none;margin-top:8px">' + nextLabel + '</button>'
    + '</div>';

  lessonContent.innerHTML = html;
}

// ── STAGE 4: 회상 ─────────────────────────────────────────
function renderStage4() {
  lessonStage = 4;
  s34Sub = null;
  const item  = lessonItems[lessonIdx];
  const forms = item.data.forms;
  // Stage 3에서 이미 보여준 인덱스(0, 중간, 마지막)를 제외하고 선택해 다양성 확보
  const s3Used = new Set([0, Math.floor(forms.length / 2), forms.length - 1]);
  const candidates = forms.map((_, i) => i).filter(i => !s3Used.has(i));
  const pool = candidates.length > 0 ? candidates : forms.map((_, i) => i);
  s34Form   = canonicalForm(item.data, forms[pool[Math.floor(Math.random() * pool.length)]]);
  s34Fields = buildFields(item, s34Form);
  s34UserAns   = {};
  s34Submitted = false;

  const allKeys = s34Fields.map(f => f.key);

  let html = stagePips(4)
    + '<p style="text-align:center;font-size:13px;color:#888;margin:0 0 4px">4단계 · 회상</p>'

      + item.data.dict

    + '<div class="lesson-card">'
      + '<div class="lesson-card-title">모든 항목을 분석하세요 (힌트 없음)</div>'

  s34Fields.forEach(field => {
    html += '<div class="s34-field">'
      + '<div class="s34-field-lbl">' + field.label + '</div>'
      + '<div class="s34-opts">';
    field.opts.forEach(opt => {
      html += '<button class="s34-opt" data-action="s34-select" data-key="'
        + field.key + '" data-val="' + opt + '">' + opt + '</button>';
    });
    html += '</div></div>';
  });

  html += '</div>'
    + '<div id="s34Feedback" style="margin-top:12px"></div>'
    + '<button class="lesson-btn primary" id="s34SubmitBtn" data-action="s34-submit"'
      + ' style="display:none;margin-top:14px">확인</button>'
    + '<button class="lesson-btn success" id="s34NextBtn" data-action="s34-next"'
      + ' style="display:none;margin-top:8px">레슨 완료 →</button>'
    + '</div>';

  lessonContent.innerHTML = html;
