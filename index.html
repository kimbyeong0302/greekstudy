<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬라어 퀴즈</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #f4f1ea;
  color: #222;
  min-height: 100vh;
}
.screen {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px 16px 72px;
}

/* ── 메뉴 ── */
h1 { font-size: 22px; text-align: center; margin: 0 0 24px; font-weight: 700; }

.menu-card {
  background: #fff;
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
}
.menu-card-title {
  font-size: 11px;
  font-weight: 700;
  color: #aaa;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin: 0 0 12px;
}
.check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 0;
  -webkit-tap-highlight-color: transparent;
}
.check-row input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: #2e6ed6;
  cursor: pointer;
  flex-shrink: 0;
}
.week-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  margin-left: 28px;
}
.week-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 20px;
  background: #f0ede6;
  font-size: 13px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
.week-chip input { accent-color: #2e6ed6; width: 13px; height: 13px; cursor: pointer; }
.week-chip.on { background: #eaf1fd; color: #2e6ed6; font-weight: 600; }

.level-row-menu {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.lv-btn {
  flex: 1;
  padding: 9px 4px;
  font-size: 12px;
  line-height: 1.4;
  border-radius: 10px;
  border: 1.5px solid #ddd;
  background: #fff;
  color: #666;
  cursor: pointer;
}
.lv-btn.active {
  border-color: #2e6ed6;
  background: #eaf1fd;
  color: #2e6ed6;
  font-weight: 600;
}

.start-btn {
  width: 100%;
  padding: 16px;
  font-size: 16px;
  font-weight: 700;
  border-radius: 14px;
  border: none;
  background: #2e6ed6;
  color: #fff;
  cursor: pointer;
  margin-top: 6px;
}
.start-btn:active { opacity: 0.85; }
.menu-err {
  text-align: center;
  color: #d64545;
  font-size: 13px;
  margin-top: 10px;
  display: none;
}

/* ── 퀴즈 ── */
.status {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  color: #555;
  margin-bottom: 12px;
}
#scoreEl { font-weight: 600; color: #222; }

.q-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 10px;
  margin-bottom: 10px;
  letter-spacing: 0.3px;
}
.q-badge.alpha { background: #f2ecff; color: #7c3aed; }
.q-badge.word  { background: #eaf1fd; color: #2e6ed6; }

.word-card {
  background: #fff;
  border-radius: 16px;
  padding: 28px 16px 24px;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  margin-bottom: 18px;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#wordDisplay {
  font-weight: 700;
  word-break: break-word;
  overflow-wrap: break-word;
  line-height: 1.3;
  width: 100%;
}
#subDisplay { font-size: 16px; color: #777; margin-top: 6px; }
#subDisplay:empty { display: none; }
#hintText   { font-size: 13px; color: #999; margin-top: 10px; }

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.choices button {
  padding: 13px 8px;
  font-size: 14px;
  border-radius: 10px;
  border: 1.5px solid #ddd;
  background: #fff;
  cursor: pointer;
  line-height: 1.3;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.choices button:active { transform: scale(0.97); }
.choices button.correct { border-color: #2e9e4f; background: #e6f6ea; }
.choices button.wrong   { border-color: #d64545; background: #fdecec; }

#feedbackEl {
  min-height: 20px;
  text-align: center;
  font-size: 14px;
  margin-top: 14px;
}
.correct-text { color: #2e9e4f; }
.wrong-text   { color: #d64545; }
.final {
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  margin-top: 10px;
}

.btn-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.btn-row button {
  padding: 10px 16px;
  font-size: 13px;
  border-radius: 10px;
  border: 1.5px solid #ccc;
  background: #fff;
  cursor: pointer;
}
#menuBtn  { color: #888; border-color: #e0e0e0; font-size: 12px; }
#retryBtn { display:none; color: #2e9e4f; border-color: #2e9e4f; font-weight: 600; }

.countdown {
  display: inline-block;
  margin-left: 10px;
  font-size: 18px;
  font-weight: 700;
  color: #2e6ed6;
  min-width: 24px;
  text-align: center;
}

.count-line {
  text-align: center;
  font-size: 12px;
  color: #aaa;
  margin-top: 24px;
}

/* ── 틀린 목록 ── */
#wrongList { display:none; margin-top: 24px; }
.wl-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: #333; }
.all-correct {
  text-align: center; font-size: 15px; color: #2e9e4f;
  font-weight: 700; background: #e6f6ea; border-radius: 14px;
  padding: 20px; margin: 0;
}
.wi {
  background: #fff; border-radius: 12px;
  border: 1.5px solid #f0c0c0; padding: 14px 16px; margin-bottom: 10px;
}
.wi-badge { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.wi-badge.alpha { color: #7c3aed; }
.wi-badge.word  { color: #2e6ed6; }
.wi-q   { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.wi-row { display: flex; gap: 8px; font-size: 13px; margin-top: 4px; align-items: baseline; }
.wi-lbl { color: #aaa; flex-shrink: 0; }
.wi-wrong   { color: #d64545; font-weight: 600; }
.wi-correct { color: #2e9e4f; font-weight: 600; }
</style>
</head>
<body>

<!-- ═══════════════ 메뉴 화면 ═══════════════ -->
<div id="menuScreen" class="screen">
  <h1>헬라어 퀴즈</h1>

  <div class="menu-card">
    <div class="menu-card-title">퀴즈 선택</div>

    <label class="check-row">
      <input type="checkbox" id="chkAlpha">
      알파벳 퀴즈 <span style="font-size:13px;color:#999;font-weight:400">(24자)</span>
    </label>

    <div style="height:14px"></div>

    <label class="check-row">
      <input type="checkbox" id="chkWord">
      단어 퀴즈
    </label>
    <div id="weekChips" class="week-chips" style="display:none"></div>
  </div>

  <div id="levelCard" class="menu-card" style="display:none">
    <div class="menu-card-title">단어 퀴즈 난이도</div>
    <div class="level-row-menu" id="lvRow">
      <button class="lv-btn active" data-lv="1">1단계<br><span style="font-size:11px;color:inherit;opacity:.75">헬라어+발음 → 뜻</span></button>
      <button class="lv-btn"        data-lv="2">2단계<br><span style="font-size:11px;color:inherit;opacity:.75">헬라어 → 뜻</span></button>
      <button class="lv-btn"        data-lv="3">3단계<br><span style="font-size:11px;color:inherit;opacity:.75">뜻 → 헬라어</span></button>
    </div>
  </div>

  <button id="startBtn" class="start-btn">퀴즈 시작</button>
  <div id="menuErr" class="menu-err"></div>
</div>

<!-- ═══════════════ 퀴즈 화면 ═══════════════ -->
<div id="quizScreen" class="screen" style="display:none">
  <h1>헬라어 퀴즈</h1>
  <div class="status">
    <span id="progressEl">문제 1 / 1</span>
    <span id="scoreEl">맞은 개수: 0</span>
  </div>

  <div class="word-card">
    <div id="qBadge" class="q-badge alpha">알파벳</div>
    <div id="wordDisplay"></div>
    <div id="subDisplay"></div>
    <div id="hintText"></div>
  </div>

  <div class="choices" id="choicesEl"></div>
  <div id="feedbackEl"></div>

  <div class="btn-row">
    <button id="retryBtn">↺ 같은 설정으로 다시</button>
    <button id="menuBtn">← 메뉴로 돌아가기</button>
  </div>

  <div id="wrongList"></div>
  <div class="count-line" id="countEl"></div>
</div>

<script>
const letters = [
  {u:"Α",l:"α",name:"알파 (alpha)"},
  {u:"Β",l:"β",name:"베타 (beta)"},
  {u:"Γ",l:"γ",name:"감마 (gamma)"},
  {u:"Δ",l:"δ",name:"델타 (delta)"},
  {u:"Ε",l:"ε",name:"엡실론 (epsilon)"},
  {u:"Ζ",l:"ζ",name:"제타 (zeta)"},
  {u:"Η",l:"η",name:"에타 (eta)"},
  {u:"Θ",l:"θ",name:"세타 (theta)"},
  {u:"Ι",l:"ι",name:"이오타 (iota)"},
  {u:"Κ",l:"κ",name:"카파 (kappa)"},
  {u:"Λ",l:"λ",name:"람다 (lambda)"},
  {u:"Μ",l:"μ",name:"뮤 (mu)"},
  {u:"Ν",l:"ν",name:"뉴 (nu)"},
  {u:"Ξ",l:"ξ",name:"크시 (xi)"},
  {u:"Ο",l:"ο",name:"오미크론 (omicron)"},
  {u:"Π",l:"π",name:"파이 (pi)"},
  {u:"Ρ",l:"ρ",name:"로 (rho)"},
  {u:"Σ",l:"σ/ς",name:"시그마 (sigma)"},
  {u:"Τ",l:"τ",name:"타우 (tau)"},
  {u:"Υ",l:"υ",name:"윕실론 (upsilon)"},
  {u:"Φ",l:"φ",name:"피 (phi)"},
  {u:"Χ",l:"χ",name:"키 (chi)"},
  {u:"Ψ",l:"ψ",name:"프시 (psi)"},
  {u:"Ω",l:"ω",name:"오메가 (omega)"}
];

const words = [
  {gr:"ἀγάπη",       kr:"아가페",          en:"love",               ko:"사랑",            week:1},
  {gr:"ἀδελφός",     kr:"아델포스",        en:"brother",            ko:"형제",            week:1},
  {gr:"ἅγιος",       kr:"하기오스",        en:"holy",               ko:"거룩한",          week:1},
  {gr:"αἷμα",        kr:"하이마",          en:"blood",              ko:"피",              week:1},
  {gr:"ἁμαρτία",     kr:"하마르티아",      en:"sin",                ko:"죄",              week:1},
  {gr:"γλῶσσα",      kr:"글로사",          en:"tongue, language",   ko:"혀, 언어",        week:1},
  {gr:"ἐκκλησία",    kr:"에클레시아",      en:"church, assembly",   ko:"교회, 모임",      week:1},
  {gr:"ἔργον",       kr:"에르곤",          en:"work",               ko:"일, 행위",        week:1},
  {gr:"εὐαγγέλιον",  kr:"유앙겔리온",      en:"good news, Gospel",  ko:"좋은 소식, 복음", week:1},
  {gr:"Ἰησοῦς",      kr:"이에수스",        en:"Jesus",              ko:"예수",            week:1},
  {gr:"Ἰσραήλ",      kr:"이스라엘",        en:"Israel",             ko:"이스라엘",        week:1},
  {gr:"λίθος",       kr:"리도스",          en:"stone",              ko:"돌",              week:1},
  {gr:"μέγας",       kr:"메가스",          en:"large, great",       ko:"크다, 위대한",    week:1},
  {gr:"μήτηρ",       kr:"메테르",          en:"mother",             ko:"어머니",          week:1},
  {gr:"Μωϋσῆς",      kr:"모위세스",        en:"Moses",              ko:"모세",            week:1},
  {gr:"νόμος",       kr:"노모스",          en:"law",                ko:"율법",            week:1},
  {gr:"παραβολή",    kr:"파라볼레",        en:"parable",            ko:"비유",            week:1},
  {gr:"πατήρ",       kr:"파테르",          en:"father",             ko:"아버지",          week:1},
  {gr:"πρεσβύτερος", kr:"프레스뷔테로스",  en:"elder",              ko:"장로",            week:1},
  {gr:"πῦρ",         kr:"퓌르",            en:"fire",               ko:"불",              week:1},
  {gr:"ὕδωρ",        kr:"휘도르",          en:"water",              ko:"물",              week:1},
  {gr:"Φαρισαῖος",   kr:"파리사이오스",    en:"Pharisee",           ko:"바리새인",        week:1},
  {gr:"ψυχή",        kr:"프쉬케",          en:"soul, life, self",   ko:"영혼, 생명",      week:1}
  // ,{gr:"νέος", kr:"네오스", en:"new, young", ko:"새로운, 젊은", week:2}
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let selectedLevel = 1;
let savedConfig   = null;
let quizOrder     = [];
let qIdx          = 0;
let score         = 0;
let answered      = false;
let wrongAnswers  = [];
let autoTimer     = null;

const menuScreen = document.getElementById('menuScreen');
const quizScreen = document.getElementById('quizScreen');
const chkAlpha   = document.getElementById('chkAlpha');
const chkWord    = document.getElementById('chkWord');
const weekChips  = document.getElementById('weekChips');
const levelCard  = document.getElementById('levelCard');
const lvRow      = document.getElementById('lvRow');
const startBtn   = document.getElementById('startBtn');
const menuErr    = document.getElementById('menuErr');
const progressEl = document.getElementById('progressEl');
const scoreEl    = document.getElementById('scoreEl');
const qBadge     = document.getElementById('qBadge');
const wordDisplay= document.getElementById('wordDisplay');
const subDisplay = document.getElementById('subDisplay');
const hintText   = document.getElementById('hintText');
const choicesEl  = document.getElementById('choicesEl');
const feedbackEl = document.getElementById('feedbackEl');
const menuBtn    = document.getElementById('menuBtn');
const retryBtn   = document.getElementById('retryBtn');
const wrongListEl= document.getElementById('wrongList');
const countEl    = document.getElementById('countEl');

function buildWeekChips() {
  const weeks = [...new Set(words.map(w => w.week))].sort((a, b) => a - b);
  weekChips.innerHTML = weeks.map(wk => {
    const cnt = words.filter(w => w.week === wk).length;
    return `<label class="week-chip on" id="chip${wk}">
      <input type="checkbox" class="wk-cb" value="${wk}" checked>
      ${wk}주차 <span style="opacity:.6;font-weight:400">(${cnt}개)</span>
    </label>`;
  }).join('');
  weekChips.querySelectorAll('.wk-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('.week-chip').classList.toggle('on', cb.checked);
    });
  });
}
buildWeekChips();

chkWord.addEventListener('change', function () {
  const on = this.checked;
  weekChips.style.display = on ? 'flex' : 'none';
  levelCard.style.display  = on ? 'block' : 'none';
});

lvRow.addEventListener('click', e => {
  const btn = e.target.closest('.lv-btn');
  if (!btn) return;
  lvRow.querySelectorAll('.lv-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedLevel = parseInt(btn.dataset.lv);
});

startBtn.addEventListener('click', () => {
  const doAlpha = chkAlpha.checked;
  const doWord  = chkWord.checked;
  if (!doAlpha && !doWord) { showErr('퀴즈 유형을 하나 이상 선택해주세요.'); return; }
  const selWeeks = doWord
    ? [...weekChips.querySelectorAll('.wk-cb:checked')].map(c => parseInt(c.value))
    : [];
  if (doWord && selWeeks.length === 0) { showErr('단어 퀴즈의 주차를 하나 이상 선택해주세요.'); return; }
  menuErr.style.display = 'none';
  savedConfig = { doAlpha, doWord, selWeeks, level: selectedLevel };
  launchQuiz(savedConfig);
});

function showErr(msg) {
  menuErr.textContent = msg;
  menuErr.style.display = 'block';
}

function launchQuiz(cfg) {
  let qs = [];
  if (cfg.doAlpha) letters.forEach(lt => qs.push({ type: 'alpha', data: lt }));
  if (cfg.doWord) {
    words.filter(w => cfg.selWeeks.includes(w.week))
         .forEach(w => qs.push({ type: 'word', data: w, level: cfg.level }));
  }
  quizOrder = shuffle(qs);
  qIdx = 0; score = 0; answered = false; wrongAnswers = [];
  menuScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  window.scrollTo(0, 0);
  renderQuestion();
}

function startCountdown() {
  let count = 3;
  feedbackEl.innerHTML += ' <span class="countdown">' + count + '</span>';
  const cdEl = feedbackEl.querySelector('.countdown');
  autoTimer = setInterval(() => {
    count--;
    if (count > 0) { cdEl.textContent = count; }
    else { clearInterval(autoTimer); autoTimer = null; qIdx++; renderQuestion(); }
  }, 1000);
}

function renderQuestion() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  answered = false;
  feedbackEl.innerHTML = '';
  retryBtn.style.display = 'none';
  wrongListEl.style.display = 'none';
  wrongListEl.innerHTML = '';
  const q = quizOrder[qIdx];
  progressEl.textContent = '문제 ' + (qIdx + 1) + ' / ' + quizOrder.length;
  scoreEl.textContent    = '맞은 개수: ' + score;
  countEl.textContent    = '총 ' + quizOrder.length + '문제';
  if (q.type === 'alpha') renderAlpha(q);
  else renderWord(q);
}

function renderAlpha(q) {
  const lt = q.data;
  qBadge.textContent = '알파벳';
  qBadge.className   = 'q-badge alpha';
  wordDisplay.style.fontSize = '52px';
  wordDisplay.textContent    = lt.u + '   ' + lt.l;
  subDisplay.textContent     = '';
  hintText.textContent       = '이 글자의 이름은?';
  const pool = shuffle(letters.filter(x => x.name !== lt.name)).slice(0, 3);
  pool.push(lt);
  buildChoices(shuffle(pool), opt => opt.name, lt.name, q);
}

function renderWord(q) {
  const w = q.data; const lv = q.level;
  qBadge.textContent = w.week + '주차 단어';
  qBadge.className   = 'q-badge word';
  if (lv === 3) {
    wordDisplay.style.fontSize = '22px';
    wordDisplay.textContent    = w.ko || w.en;
    subDisplay.textContent     = '';
    hintText.textContent       = '이 뜻에 해당하는 헬라어 단어는?';
  } else {
    wordDisplay.style.fontSize = '32px';
    wordDisplay.textContent    = w.gr;
    subDisplay.textContent     = (lv === 1 && w.kr) ? '[' + w.kr + ']' : '';
    hintText.textContent       = '이 단어의 뜻은?';
  }
  const matchKey = lv === 3 ? 'gr' : 'en';
  const pool = shuffle(words.filter(x => x[matchKey] !== w[matchKey])).slice(0, 3);
  pool.push(w);
  buildChoices(shuffle(pool), opt => opt[matchKey], w[matchKey], q);
}

function buildChoices(opts, getValue, correctVal, q) {
  choicesEl.innerHTML = '';
  opts.forEach(opt => {
    const val = getValue(opt);
    const btn = document.createElement('button');
    btn.textContent = val;
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      if (val === correctVal) {
        score++;
        btn.classList.add('correct');
        feedbackEl.innerHTML = '<span class="correct-text">정답입니다.</span>';
      } else {
        btn.classList.add('wrong');
        wrongAnswers.push({ q, chosen: val, correct: correctVal });
        feedbackEl.innerHTML = '<span class="wrong-text">오답입니다. 정답: ' + correctVal + '</span>';
      }
      scoreEl.textContent = '맞은 개수: ' + score;
      Array.from(choicesEl.children).forEach(c => {
        if (c.textContent === correctVal && c !== btn) c.classList.add('correct');
      });
      if (qIdx < quizOrder.length - 1) {
        startCountdown();
      } else {
        feedbackEl.innerHTML +=
          '<div class="final">퀴즈 종료! 최종 점수: ' + score + ' / ' + quizOrder.length + '</div>';
        retryBtn.style.display = 'inline-block';
        showWrongList();
      }
    });
    choicesEl.appendChild(btn);
  });
}

function showWrongList() {
  wrongListEl.style.display = 'block';
  setTimeout(() => wrongListEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
  if (wrongAnswers.length === 0) {
    wrongListEl.innerHTML = '<p class="all-correct">모두 맞혔습니다! 🎉</p>';
    return;
  }
  let html = '<p class="wl-title">틀린 문제 목록 (' + wrongAnswers.length + '개)</p>';
  wrongAnswers.forEach(({ q, chosen, correct }) => {
    let badge, qText;
    if (q.type === 'alpha') {
      badge = '<div class="wi-badge alpha">알파벳</div>';
      qText = q.data.u + '  ' + q.data.l;
    } else {
      const w = q.data; const lv = q.level;
      badge = '<div class="wi-badge word">' + w.week + '주차 단어</div>';
      qText = lv === 3
        ? (w.ko || w.en)
        : w.gr + (w.kr ? ' <span style="font-size:13px;font-weight:400;color:#888">[' + w.kr + ']</span>' : '');
    }
    html += '<div class="wi">' + badge +
      '<div class="wi-q">' + qText + '</div>' +
      '<div class="wi-row"><span class="wi-lbl">내 답&nbsp;</span><span class="wi-wrong">' + chosen + '</span></div>' +
      '<div class="wi-row"><span class="wi-lbl">정&nbsp;&nbsp;답&nbsp;</span><span class="wi-correct">' + correct + '</span></div>' +
      '</div>';
  });
  wrongListEl.innerHTML = html;
}

menuBtn.addEventListener('click', () => {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  quizScreen.style.display = 'none';
  menuScreen.style.display = 'block';
  window.scrollTo(0, 0);
});

retryBtn.addEventListener('click', () => {
  if (savedConfig) launchQuiz(savedConfig);
});
</script>
</body>
</html>
