// ── STAGE 5 헬퍼 ──────────────────────────────────────────
function buildS5VerbFields(par, frm, sub) {
  const trWrong = [...new Set(par.forms.map(f => f.tr).filter(t => t !== frm.tr))];
  const trOpts  = shuffle([...shuffle(trWrong).slice(0,3), frm.tr]);
  const fields  = [
    { key:'v_tense', label:'시제', correct:par.tense, opts:shuffle(['현재','미완료','부정과거']),   expln:'이 동사는 현재 시제예요.', active:false },
    { key:'v_voice', label:'태',   correct:par.voice, opts:shuffle(['능동','중간태','수동']),         expln:'능동태는 주어가 직접 행동하는 형태예요.', active:false },
    { key:'v_mood',  label:'법',   correct:par.mood,  opts:shuffle(['직설법','가정법','명령법']),   expln:'직설법은 실제 사실을 서술하는 법이에요.', active:false },
    { key:'v_person',label:'인칭', correct:frm.person+'인칭', opts:shuffle(['1인칭','2인칭','3인칭']), expln:'어미 -'+frm.end+'는 '+frm.person+'인칭을 나타내요.', active:true },
    { key:'v_number',label:'수',   correct:frm.number, opts:['단수','복수'], expln:'어미 -'+frm.end+'는 '+frm.number+'를 나타내요.', active:true },
    { key:'v_tr',    label:'직역', correct:frm.tr,    opts:trOpts, expln:'이 형태('+frm.form+')의 의미는 "'+frm.tr+'"이에요.', active:false }
  ];
  if (sub === 'b') fields.push({ key:'v_role', label:'문장역할', correct:'서술어', opts:shuffle(['서술어','주어','목적어','수식어']), expln:'동사는 문장에서 서술어 역할을 해요.', active:true });
  return fields;
}

function buildS5NounFields(par, frm, sub) {
  const trWrong    = [...new Set(par.forms.map(f => f.tr).filter(t => t !== frm.tr))];
  const trOpts     = shuffle([...shuffle(trWrong).slice(0,3), frm.tr]);
  // Stage 5b는 문장 컨텍스트로 격 구별 가능 → extras 불필요
  const rds  = sub !== 'b' ? getFormReadings(par, frm) : null;
  const keys = { case:'n_case', number:'n_number', tr:'n_tr' };
  const roleCorrect = frm.case === '주격' ? '주어' : frm.case === '대격' ? '목적어' : frm.case === '여격' ? '간접목적어' : '수식어';
  const roleExpln   = roleCorrect === '주어' ? '주격은 문장에서 주어(~이/가) 역할을 해요.'
                    : roleCorrect === '목적어' ? '대격은 문장에서 목적어(~을/를) 역할을 해요.'
                    : roleCorrect === '간접목적어' ? '여격은 간접목적어(~에게) 역할을 해요.'
                    : '속격은 수식어(소유, ~의) 역할을 해요.';
  const fields = [
    { key:'n_gender',label:'성',   correct:par.gender, opts:shuffle(['남성','여성','중성']),        expln:'이 명사는 '+par.gender+'이에요.', active:true },
    withReadings({ key:'n_number',label:'수',   correct:frm.number, opts:['단수','복수'], expln:'어미 -'+frm.end+'는 '+frm.number+'를 나타내요.'+(rds && rds.some(r => r.number !== frm.number) ? readingsNote(par, rds) : ''), active:true }, rds, 'number', keys),
    withReadings({ key:'n_case',  label:'격',   correct:frm.case,   opts:shuffle(['주격','속격','여격','대격']),
      expln:'어미 -'+frm.end+'는 '+frm.case+' '+frm.number+'를 나타내요.'+readingsNote(par, rds), active:true }, rds, 'case', keys),
    withReadings({ key:'n_tr',    label:'직역', correct:frm.tr,     opts:trOpts, expln:'이 형태('+frm.form+')의 의미는 "'+frm.tr+'"이에요.', active:false }, rds, 'tr', keys)
  ];
  if (sub === 'b') fields.push({ key:'n_role', label:'문장역할', correct:roleCorrect, opts:shuffle(['주어','목적어','간접목적어','수식어']), expln:roleExpln, active:true });
  return fields;
}

// ── STAGE 5: 누적 적용 ─────────────────────────────────────
function renderStage5(sub) {
  lessonStage = 5;
  s5Sub       = sub;
  s5UserAns   = {};
  s5Submitted = false;

  const item    = lessonItems[lessonIdx];
  if (item.type === 'adj') { renderStage5Adj(item, sub); return; }
  const pair    = pairings[lessonIdx];
  const verbPar = verbParadigms[pair.vI];
  const nounPar = nounParadigms[pair.nI];
  // 5b는 pair의 문장과 형태가 일치해야 하므로 고정, 5a는 무작위 선택
  const verbFrmIdx = sub === 'b' ? pair.vFI : Math.floor(Math.random() * verbPar.forms.length);
  const nounFrmIdx = sub === 'b' ? pair.nFI : Math.floor(Math.random() * nounPar.forms.length);
  const verbFrm = verbPar.forms[verbFrmIdx];
  // 5b는 문장 속 격이 정해져 있으므로 그대로, 5a만 기본 읽기로
  const nounFrm = sub === 'b' ? nounPar.forms[nounFrmIdx] : canonicalForm(nounPar, nounPar.forms[nounFrmIdx]);

  s5VerbFields = buildS5VerbFields(verbPar, verbFrm, sub);
  s5NounFields = buildS5NounFields(nounPar, nounFrm, sub);
  fixGivenReadings(s5NounFields, f => !f.active);

  const subLabel = sub === 'a' ? '동사+명사 묶어보기' : '문장 속 역할 파악';

  function renderFieldGroup(fields, formHtml) {
    let h = '<div style="text-align:center;font-size:28px;font-weight:700;padding:6px 0 12px">' + formHtml + '</div>';
    h += '<div class="s34-fields">';
    fields.forEach(field => {
      h += '<div class="s34-field"><div class="s34-field-lbl">' + field.label + '</div>';
      if (field.active) {
        h += '<div class="s34-opts">';
        field.opts.forEach(opt => {
          h += '<button class="s34-opt" data-action="s5-select" data-key="' + field.key + '" data-val="' + opt + '">' + opt + '</button>';
        });
        h += '</div>';
      } else {
        h += '<div class="s34-given">' + field.correct + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
    return h;
  }

  let html = stagePips(5)
    + '<p style="text-align:center;font-size:13px;color:#888;margin:0 0 4px">5단계 · 누적 적용 (' + subLabel + ')</p>'
    + '<p style="text-align:center;font-size:20px;font-weight:700;margin:0 0 18px">'
      + item.data.dict + ' <span style="font-size:14px;color:#888;font-weight:400">— ' + item.data.meaning + '</span></p>';

  if (sub === 'b') {
    html += '<div class="lesson-card">'
      + '<div class="lesson-card-title">문장</div>'
      + '<p class="s6-sentence">' + pair.s5b + '</p>'
      + '<p style="text-align:center;font-size:13px;color:#999;margin:6px 0 0">' + pair.s5bKo + '</p>'
      + '</div>';
  }

  html += '<div class="lesson-card">'
    + '<div class="lesson-card-title">동사 — ' + verbPar.dict + '</div>'
    + renderFieldGroup(s5VerbFields, formWithHi(verbFrm.form, verbFrm.end))
    + '</div>'
    + '<div class="lesson-card">'
    + '<div class="lesson-card-title">명사 — ' + nounPar.dict + '</div>'
    + renderFieldGroup(s5NounFields, formWithHi(nounFrm.form, nounFrm.end))
    + '</div>'
    + '<div id="s5Feedback" style="margin-top:12px"></div>'
    + '<button class="lesson-btn primary" id="s5SubmitBtn" data-action="s5-submit" style="display:none;margin-top:14px">확인</button>'
    + '<button class="lesson-btn success" id="s5NextBtn" data-action="s5-next" style="display:none;margin-top:8px">'
      + (sub === 'a' ? '5b: 문장 역할 분석으로 →' : '6단계 실제 분석으로 →')
      + '</button>';

  lessonContent.innerHTML = html;
}

// ── STAGE 5 (형용사·관사) ──────────────────────────────────
// 5a: 관사+형용사+명사 구에서 성·수·격 일치 분석 (§63)
// 5b: 한정적/서술적 용법 구별 (§65~68, 관사는 5a만)
const AGREE_KO = { '남성': '말씀', '여성': '문서', '중성': '선물' };
function renderStage5Adj(item, sub) {
  const d     = item.data;
  const isArt = d.kind === 'article';
  const art   = adjParadigms.find(p => p.kind === 'article');
  const pick  = (par, g, c, n) => par.forms.find(f => f.gender === g && f.case === c && f.number === n);
  let phraseGr, groups;

  if (sub === 'a') {
    const frm     = canonicalForm(d, d.forms[Math.floor(Math.random() * d.forms.length)]);
    const nounPar = nounParadigms.find(n => n.dict === AGREE_NOUNS[frm.gender]);
    const nounFrm = nounPar.forms.find(f => f.case === frm.case && f.number === frm.number);
    phraseGr = isArt
      ? phrase([frm.form, nounFrm.form])
      : phrase([pick(art, frm.gender, frm.case, frm.number).form, frm.form, nounFrm.form]);
    s5VerbFields = buildAdjFields(d, frm, { gender:'a_gender', case:'a_case', number:'a_number' }, false)
      .map(f => Object.assign(f, { active: true }));
    s5NounFields = buildS5NounFields(nounPar, nounFrm, 'a');
    fixGivenReadings(s5NounFields, f => !f.active);
    groups = [
      { title: (isArt ? '관사 — ' : '형용사 — ') + d.dict, fields: s5VerbFields, formHtml: formWithHi(frm.form, frm.end) },
      { title: '명사 — ' + nounPar.dict, fields: s5NounFields, formHtml: formWithHi(nounFrm.form, nounFrm.end) }
    ];
  } else {
    const g   = ['남성', '여성', '중성'][Math.floor(Math.random() * 3)];
    const a   = pick(art, g, '주격', '단수').form;
    const adj = pick(d, g, '주격', '단수').form;
    const nn  = AGREE_NOUNS[g];
    const patterns = [
      { words: [a, adj, nn],     use: '한정적' },
      { words: [a, nn, a, adj],  use: '한정적' },
      { words: [a, nn, adj],     use: '서술적' },
      { words: [adj, a, nn],     use: '서술적' }
    ];
    const pt = patterns[Math.floor(Math.random() * patterns.length)];
    phraseGr = phrase(pt.words);
    const attrKo = '그 ' + d.attr + ' ' + AGREE_KO[g];
    const predKo = '그 ' + josaEunNeun(AGREE_KO[g]) + ' ' + d.pred;
    s5VerbFields = [
      { key:'u_use',  label:'용법', correct: pt.use, opts: ['한정적', '서술적'], active: true,
        expln: pt.use === '한정적'
          ? '형용사 바로 앞에 관사가 있으면 한정적 용법이에요 (§66).'
          : '형용사 바로 앞에 관사가 없으면 서술적 용법이에요 (§67).' },
      { key:'u_mean', label:'뜻', correct: pt.use === '한정적' ? attrKo : predKo,
        opts: shuffle([attrKo, predKo]), active: true,
        expln: '한정적 용법은 "' + attrKo + '", 서술적 용법은 "' + predKo + '"예요 (§68).' }
    ];
    s5NounFields = [];
    groups = [{ title: '이 구의 형용사 용법은?', fields: s5VerbFields, formHtml: '' }];
  }

  function renderFieldGroup(fields, formHtml) {
    let h = formHtml ? '<div style="text-align:center;font-size:28px;font-weight:700;padding:6px 0 12px">' + formHtml + '</div>' : '';
    h += '<div class="s34-fields">';
    fields.forEach(field => {
      h += '<div class="s34-field"><div class="s34-field-lbl">' + field.label + '</div>';
      if (field.active) {
        h += '<div class="s34-opts">';
        field.opts.forEach(opt => {
          h += '<button class="s34-opt" data-action="s5-select" data-key="' + field.key + '" data-val="' + opt + '">' + opt + '</button>';
        });
        h += '</div>';
      } else {
        h += '<div class="s34-given">' + field.correct + '</div>';
      }
      h += '</div>';
    });
    return h + '</div>';
  }

  const subLabel = sub === 'a' ? (isArt ? '관사+명사 일치' : '형용사+명사 일치') : '한정적·서술적 용법';
  let html = stagePips(5)
    + '<p style="text-align:center;font-size:13px;color:#888;margin:0 0 4px">5단계 · 누적 적용 (' + subLabel + ')</p>'
    + '<p style="text-align:center;font-size:20px;font-weight:700;margin:0 0 18px">'
      + d.dict + ' <span style="font-size:14px;color:#888;font-weight:400">— ' + d.meaning + '</span></p>'
    + '<div class="lesson-card"><div class="lesson-card-title">' + (sub === 'a' ? '구' : '구 (명사 앞 관사 유무를 보세요)') + '</div>'
      + '<p class="s6-sentence">' + phraseGr + '</p>'
    + '</div>';
  groups.forEach(gp => {
    html += '<div class="lesson-card"><div class="lesson-card-title">' + gp.title + '</div>'
      + renderFieldGroup(gp.fields, gp.formHtml) + '</div>';
  });
  html += '<div id="s5Feedback" style="margin-top:12px"></div>'
    + '<button class="lesson-btn primary" id="s5SubmitBtn" data-action="s5-submit" style="display:none;margin-top:14px">확인</button>'
    + '<button class="lesson-btn success" id="s5NextBtn" data-action="s5-next" style="display:none;margin-top:8px">'
      + (sub === 'a' && !isArt ? '5b: 한정적·서술적 용법으로 →' : '6단계 실제 분석으로 →')
      + '</button>';
  lessonContent.innerHTML = html;
}

// ── STAGE 6 헬퍼 ──────────────────────────────────────────
function buildS6Fields(word, sentence) {
  const fields = [];
  if (word.type === 'verb') {
    const par = verbParadigms.find(v => v.dict === word.dict);
    const frm = par.forms.find(f => f.person === word.person && f.number === word.number);
    const trWrong = [...new Set(par.forms.map(f => f.tr).filter(t => t !== frm.tr))];
    const trOpts  = shuffle([...shuffle(trWrong).slice(0,3), frm.tr]);
    fields.push(
      { key:'tense', label:'시제', correct:par.tense, opts:shuffle(['현재','미완료','부정과거']),   expln:'이 동사는 현재 시제예요.' },
      { key:'voice', label:'태',   correct:par.voice, opts:shuffle(['능동','중간태','수동']),         expln:'능동태는 주어가 직접 행동하는 형태예요.' },
      { key:'mood',  label:'법',   correct:par.mood,  opts:shuffle(['직설법','가정법','명령법']),   expln:'직설법은 실제 사실을 서술하는 법이에요.' },
      { key:'person',label:'인칭', correct:frm.person+'인칭', opts:shuffle(['1인칭','2인칭','3인칭']), expln:'어미 -'+frm.end+'는 '+frm.person+'인칭을 나타내요.' },
      { key:'number',label:'수',   correct:frm.number, opts:['단수','복수'], expln:'어미 -'+frm.end+'는 '+frm.number+'를 나타내요.' },
      { key:'tr',    label:'직역', correct:frm.tr, opts:trOpts, expln:'이 형태('+frm.form+')의 의미는 "'+frm.tr+'"이에요.' },
      { key:'role',  label:'문장역할', correct:word.role, opts:shuffle(['서술어','주어','목적어','수식어']), expln:'동사는 문장에서 서술어 역할을 해요.' }
    );
  } else if (word.type === 'adj') {
    const par = adjParadigms.find(a => a.dict === word.dict);
    const frm = par.forms.find(f => f.gender === word.gender && f.case === word.case && f.number === word.number);
    fields.push(...buildAdjFields(par, frm, { gender:'gender', case:'case', number:'number' }, false));
    if (word.agrees) {
      // 문장 속 다른 낱말 중에서 일치하는 낱말 고르기
      const toks = [...new Set(sentence.gr.split(' ').map(t => t.replace(/[.,·;:]/g, '')))]
        .filter(t => t !== word.agrees && normWord(t) !== normWord(word.form));
      fields.push({ key:'agrees', label:'일치 단어', correct: word.agrees,
        opts: shuffle([word.agrees, ...shuffle(toks).slice(0, 3)]),
        expln: word.form + '는 ' + word.agrees + '와 성·수·격(' + word.gender + ' ' + word.case + ' ' + word.number + ')이 일치해요.' });
    }
    if (word.role) {
      fields.push({ key:'role', label:'용법', correct: word.role, opts: ['한정적','서술적','독립적'],
        expln: word.role === '한정적' ? '관사 바로 뒤에 형용사가 오면 한정적 용법이에요 (§66).'
             : word.role === '서술적' ? '형용사 바로 앞에 관사가 없으면 서술적 용법이에요 (§67).'
             : '형용사가 명사처럼 쓰이면 독립적 용법이에요 (§70).' });
    }
  } else {
    const par = nounParadigms.find(n => n.dict === word.dict);
    const frm = par.forms.find(f => f.case === word.case && f.number === word.number);
    const rds  = getFormReadings(par, frm);
    const keys = { case:'case', number:'number', tr:'tr' };
    const trWrong = [...new Set(par.forms.map(f => f.tr).filter(t => t !== frm.tr))];
    const trOpts  = shuffle([...shuffle(trWrong).slice(0,3), frm.tr]);
    const roleExpln = word.role === '주어' ? '주격은 문장에서 주어(~이/가) 역할을 해요.'
                    : word.role === '목적어' ? '대격은 문장에서 목적어(~을/를) 역할을 해요.'
                    : word.role === '간접목적어' ? '여격은 간접목적어(~에게) 역할을 해요.'
                    : '속격은 수식어(소유, ~의) 역할을 해요.';
    fields.push(
      { key:'gender',label:'성',   correct:par.gender, opts:shuffle(['남성','여성','중성']),        expln:'이 명사는 '+par.gender+'이에요.' },
      withReadings({ key:'number',label:'수',   correct:frm.number, opts:['단수','복수'], expln:'어미 -'+frm.end+'는 '+frm.number+'를 나타내요.'+(rds && rds.some(r => r.number !== frm.number) ? readingsNote(par, rds) : '') }, rds, 'number', keys),
      withReadings({ key:'case',  label:'격',   correct:frm.case,   opts:shuffle(['주격','속격','여격','대격']),
        expln:'어미 -'+frm.end+'는 '+frm.case+' '+frm.number+'를 나타내요.'+readingsNote(par, rds) }, rds, 'case', keys),
      withReadings({ key:'tr',    label:'직역', correct:frm.tr, opts:trOpts, expln:'이 형태('+frm.form+')의 의미는 "'+frm.tr+'"이에요.' }, rds, 'tr', keys),
      { key:'role',  label:'문장역할', correct:word.role, opts:shuffle(['주어','목적어','간접목적어','수식어']), expln:roleExpln }
    );
  }
  return fields;
}

// ── 어형 변화 퀴즈 ─────────────────────────────────────────
function buildPQPool(items) {
  const MAX_Q = 30;
  // 동사/명사로 분리 후 각각 shuffle
  const verbs = shuffle(items.filter(i => i.type === 'verb'));
  const nouns = shuffle(items.filter(i => i.type === 'noun'));
  const adjs  = shuffle(items.filter(i => i.type === 'adj'));

  // 각 단어에 폼 시작 인덱스 오프셋을 부여 → 같은 타입 단어들이 Round 0에서
  // 서로 다른 격/인칭 슬롯을 담당하도록 분배 (verbs:6슬롯, nouns:8슬롯)
  const queues = [];
  [verbs, nouns, adjs].forEach(group => {
    group.forEach((item, i) => {
      const forms = item.data.forms;
      const n = forms.length;
      const start = i % n;
      queues.push({
        item,
        forms: Array.from({ length: n }, (_, j) => forms[(start + j) % n])
      });
    });
  });
  shuffle(queues); // 전체 출제 순서 랜덤화

  const pool = [];
  let round = 0;
  outer: while (true) {
    let anyAdded = false;
    for (const q of queues) {
      if (round >= q.forms.length) continue;
      pool.push({ item: q.item, form: q.forms[round] });
      anyAdded = true;
      if (pool.length >= MAX_Q) break outer;
    }
    if (!anyAdded) break;
    round++;
  }
  return shuffle(pool);
}

function buildPQFields(item, form) {
  const d = item.data, isVerb = item.type === 'verb';
  if (item.type === 'adj') {
    return buildAdjFields(d, form, { gender:'pq_gender', case:'pq_case', number:'pq_number', agree:'pq_agree' }, true);
  }
  if (isVerb) {
    const trWrong     = [...new Set(d.forms.map(f => f.tr).filter(t => t !== form.tr))];
    const trOpts      = shuffle([...shuffle(trWrong).slice(0, 3), form.tr]);
    const tenseWrong  = PQ_TENSE_OPTS.filter(o => o !== d.tense);
    const tenseOpts   = shuffle([...shuffle(tenseWrong).slice(0, 3), d.tense]);
    const voiceOpts   = shuffle([...PQ_VOICE_OPTS]);
    const moodWrong   = PQ_MOOD_OPTS.filter(o => o !== d.mood);
    const moodOpts    = shuffle([...shuffle(moodWrong).slice(0, 3), d.mood]);
    return [
      { key:'pq_tense',  label:'시제', correct: d.tense,              opts: tenseOpts },
      { key:'pq_voice',  label:'태',   correct: d.voice,              opts: voiceOpts },
      { key:'pq_mood',   label:'법',   correct: d.mood,               opts: moodOpts },
      { key:'pq_person', label:'인칭', correct: form.person + '인칭', opts: shuffle(['1인칭','2인칭','3인칭']) },
      { key:'pq_number', label:'수',   correct: form.number,          opts: ['단수','복수'] },
      { key:'pq_tr',     label:'직역', correct: form.tr,              opts: trOpts }
    ];
  } else {
    const rds     = getFormReadings(d, form);
    const keys    = { case:'pq_case', number:'pq_number', tr:'pq_tr' };
    const trWrong = [...new Set(d.forms.map(f => f.tr).filter(t => t !== form.tr))];
    const trOpts  = shuffle([...shuffle(trWrong).slice(0, 3), form.tr]);
    return [
      { key:'pq_gender', label:'성',   correct: d.gender, opts: shuffle(['남성','여성','중성']) },
      withReadings({ key:'pq_case',   label:'격',   correct: form.case, opts: shuffle(['주격','속격','여격','대격']) }, rds, 'case', keys),
      withReadings({ key:'pq_number', label:'수',   correct: form.number, opts: ['단수','복수'] }, rds, 'number', keys),
      withReadings({ key:'pq_tr',     label:'직역', correct: form.tr, opts: trOpts }, rds, 'tr', keys)
    ];
  }
}

// ── 성·수·격 퀴즈 (관사 / 형용사 어미) ─────────────────────────
// 형태 하나를 보여주고 성·수·격을 모두 고르게 한다. 같은 형태가 여러 읽기를 가지면
// (예: τοῦ = 남성·중성 속격 단수) 그중 하나와 셋이 모두 일치하면 정답.
const GNC_ADJ_MAX = 20;
const gncScreen  = document.getElementById('gncScreen');
const gncContent = document.getElementById('gncContent');
const gncErr     = document.getElementById('gncErr');
const GNC_FIELDS = [
  { key:'gender', label:'성', opts:['남성','여성','중성'] },
  { key:'number', label:'수', opts:['단수','복수'] },
  { key:'case',   label:'격', opts:['주격','속격','여격','대격'] }
];
let gncPool = [], gncIdx = 0, gncScore = 0, gncWrong = [], gncAns = {}, gncSubmitted = false;

// 패러다임의 서로 다른 형태마다 문항 하나 (읽기는 같은 형태의 모든 칸)
function gncItems(par) {
  const seen = new Set(), out = [];
  par.forms.forEach(f => {
    if (seen.has(f.form)) return;
    seen.add(f.form);
    out.push({ par, form: f, readings: par.forms.filter(x => x.form === f.form) });
  });
  return out;
}
const gncArticle = () => adjParadigms.filter(p => p.kind === 'article');
const gncAdjs    = () => adjParadigms.filter(p => p.kind === 'adj');
document.getElementById('gncArtCnt').textContent = '(' + gncArticle().flatMap(gncItems).length + '문항)';
document.getElementById('gncAdjCnt').textContent = '(' + gncAdjs().map(p => p.dict).join('·') + ' 중 '
  + Math.min(GNC_ADJ_MAX, gncAdjs().flatMap(gncItems).length) + '문항)';

function gncLabel(r) { return r.gender + ' ' + r.case + ' ' + r.number; }
function gncDictLabel(par) {
  if (par.kind === 'article') return '관사 ὁ, ἡ, τό';
  return par.forms.slice(0, 3).map(f => f.form).join(', ');   // 남·여·중 주격 단수
}

function gncSubmit() {
  if (gncSubmitted) return;
  gncSubmitted = true;
  const q  = gncPool[gncIdx];
  const ok = q.readings.some(r => GNC_FIELDS.every(f => r[f.key] === gncAns[f.key]));
  // 칸별 표시: 고른 답과 가장 많이 겹치는 읽기를 기준으로 맞은 칸/틀린 칸 구분
  const match = r => GNC_FIELDS.filter(f => r[f.key] === gncAns[f.key]).length;
  const ref   = q.readings.reduce((a, r) => match(r) > match(a) ? r : a);
  gncContent.querySelectorAll('[data-gnc-key]').forEach(b => {
    b.disabled = true;
    const key = b.dataset.gncKey, val = b.dataset.val;
    if (val === ref[key]) b.classList.add('s34-correct');
    else if (val === gncAns[key]) b.classList.add('s34-wrong');
  });
  const answer = q.readings.map(gncLabel).join(' / ');
  const fb = document.getElementById('gncFeedback');
  if (ok) {
    gncScore++;
    fb.innerHTML = '<p style="color:#2e9e4f;font-weight:700;margin:0">정답!'
      + (q.readings.length > 1 ? ' <span style="font-weight:400;color:#666">(가능한 답: ' + answer + ')</span>' : '') + '</p>';
  } else {
    gncWrong.push({ q, mine: gncLabel(gncAns), answer });
    fb.innerHTML = '<p style="color:#d64545;font-weight:700;margin:0">오답 — 정답: ' + answer + '</p>';
  }
  document.getElementById('gncSubmitBtn').style.display = 'none';
  document.getElementById('gncNextBtn').style.display = 'block';
}

  const total = gncPool.length;
  const rate  = Math.round(gncScore / total * 100);
  let html = '<div class="lesson-done-card">'
    + '<div class="lesson-done-icon">' + (rate === 100 ? '🎉' : rate >= 70 ? '✅' : '📚') + '</div>'
    + '<div class="lesson-done-title">성·수·격 퀴즈 완료!</div>'
    + '<p style="font-size:30px;font-weight:700;color:#2e6ed6;margin:10px 0 4px">' + gncScore + ' / ' + total + '</p>'
    + '<p style="font-size:15px;color:#888;margin:0">정답률 ' + rate + '%</p>'
    + '</div>';
  if (gncWrong.length) {
    html += '<div class="menu-card-title" style="margin:18px 0 8px">틀린 문제 (' + gncWrong.length + '개)</div>'
      + '<div class="s4-errors">';
    gncWrong.forEach(w => {
      html += '<div class="gnc-wrong-item">'
        + '<div class="gnc-wrong-form">' + formWithHi(w.q.form.form, w.q.form.end)
          + '<span class="gnc-wrong-dict">' + gncDictLabel(w.q.par) + '</span></div>'
        + '<div class="gnc-wrong-row">내 답: <span class="s4-wrong-txt">' + w.mine + '</span></div>'
        + '<div class="gnc-wrong-row">정답: <span class="s4-right-txt">' + w.answer + '</span></div>'
        + '</div>';
    });
    html += '</div>'
      + '<button class="lesson-btn primary" id="gncRetryWrongBtn" style="margin-top:14px">틀린 문제만 다시 풀기</button>';
  }
  html += '<button class="lesson-btn" id="gncRestartBtn" style="margin-top:8px">처음부터 다시</button>';
  gncContent.innerHTML = html;
}

gncContent.addEventListener('click', e => {
  const opt = e.target.closest('[data-gnc-key]');
  if (opt) {
    if (gncSubmitted) return;
    const key = opt.dataset.gncKey;
    gncContent.querySelectorAll('[data-gnc-key="' + key + '"]').forEach(b => b.classList.remove('s34-selected'));
    opt.classList.add('s34-selected');
    gncAns[key] = opt.dataset.val;
    if (GNC_FIELDS.every(f => gncAns[f.key])) document.getElementById('gncSubmitBtn').style.display = 'block';
    return;
  }
  const id = e.target.id;
  if (id === 'gncSubmitBtn') gncSubmit();
  else if (id === 'gncNextBtn') { gncIdx++; gncRender(); window.scrollTo(0, 0); }
  else if (id === 'gncRetryWrongBtn') gncStart(shuffle(gncWrong.map(w => w.q)));
  else if (id === 'gncRestartBtn') gncStart(gncBuildPool());
});

// ── 암기 카드 ─────────────────────────────────────────────────
// 주차 선택은 단어 퀴즈의 주차 체크박스(.wk-cb)를 그대로 사용한다
const cardScreen    = document.getElementById('cardScreen');
const cardWeekChips = document.getElementById('cardWeekChips');
const cardErr       = document.getElementById('cardErr');
const flashcard     = document.getElementById('flashcard');
const fcInner       = document.getElementById('fcInner');
const fcFront       = document.getElementById('fcFront');
const fcBack        = document.getElementById('fcBack');
const fcProgress    = document.getElementById('fcProgress');
const fcPrev        = document.getElementById('fcPrev');
const fcNext        = document.getElementById('fcNext');
const fcMark        = document.getElementById('fcMark');
const fcReviewOnly  = document.getElementById('fcReviewOnly');
const fcReviewCnt   = document.getElementById('fcReviewCnt');
const fcEmpty       = document.getElementById('fcEmpty');
const fcReviewChip  = document.getElementById('fcReviewChip');
const fcControls    = document.querySelector('.fc-controls');
const REVIEW_KEY    = 'reviewWords';

let cardWeeks = [];   // 카드 화면을 열 때 선택된 주차
let cardDeck  = [];   // 현재 보여주는 단어 목록
let cardIdx   = 0;

// "다시 볼 단어"는 이 기기(브라우저)에만 저장
function loadReview() {
  try { return new Set(JSON.parse(localStorage.getItem(REVIEW_KEY) || '[]')); } catch { return new Set(); }
}
function saveReview(set) {
  try { localStorage.setItem(REVIEW_KEY, JSON.stringify([...set])); } catch {}
}
let reviewSet = loadReview();

function selectedWeeks() {
  return [...weekChips.querySelectorAll('.wk-cb:checked')].map(c => parseInt(c.value));
}

// 메뉴의 암기 카드 주차 칩 = 단어 퀴즈 주차 체크박스의 거울
function renderCardWeekChips() {
  cardWeekChips.innerHTML = [...weekChips.querySelectorAll('.wk-cb')].map(cb => {
    const wk = parseInt(cb.value);
    const cnt = words.filter(w => w.week === wk).length;
    return '<label class="week-chip' + (cb.checked ? ' on' : '') + '">'
      + '<input type="checkbox" class="card-wk-cb" value="' + wk + '"' + (cb.checked ? ' checked' : '') + '>'
      + wk + '주차 <span style="opacity:.6;font-weight:400">(' + cnt + '개)</span></label>';
  }).join('');
}
cardWeekChips.addEventListener('change', e => {
  if (!e.target.classList.contains('card-wk-cb')) return;
  const src = weekChips.querySelector('.wk-cb[value="' + e.target.value + '"]');
  src.checked = e.target.checked;
  src.dispatchEvent(new Event('change'));
});
weekChips.addEventListener('change', () => { renderCardWeekChips(); cardErr.style.display = 'none'; });
renderCardWeekChips();

function buildDeck() {
  const pool = words.filter(w => cardWeeks.includes(w.week));
  cardDeck = fcReviewOnly.checked ? pool.filter(w => reviewSet.has(w.gr)) : pool;
  cardIdx = Math.min(cardIdx, Math.max(cardDeck.length - 1, 0));
}

function updateReviewCount() {
  const n = words.filter(w => cardWeeks.includes(w.week) && reviewSet.has(w.gr)).length;
  fcReviewCnt.textContent = '(' + n + ')';
  fcReviewChip.classList.toggle('on', fcReviewOnly.checked);
}

// 앞면으로 되돌릴 때는 애니메이션 없이 (새 카드 뒷면이 비치지 않도록)
function resetFlip() {
  fcInner.classList.add('no-anim');
  flashcard.classList.remove('flipped');
  void fcInner.offsetWidth;
  fcInner.classList.remove('no-anim');
}

function renderCard() {
  updateReviewCount();
  const empty = cardDeck.length === 0;
  flashcard.style.display  = empty ? 'none' : '';
  fcControls.style.display = empty ? 'none' : '';
  fcEmpty.hidden = !empty;
  if (empty) {
    fcProgress.textContent = '0 / 0';
    fcEmpty.textContent = fcReviewOnly.checked
      ? '다시 볼 단어로 표시한 단어가 없어요. 카드에서 ☆ 다시 볼 단어를 눌러 표시하세요.'
      : '선택한 주차에 단어가 없어요.';
    return;
  }
  const w = cardDeck[cardIdx];
  const marked = reviewSet.has(w.gr);
  fcProgress.textContent = (cardIdx + 1) + ' / ' + cardDeck.length;

  fcFront.innerHTML = '<span class="fc-week">' + w.week + '주차</span>'
    + (marked ? '<span class="fc-star">★</span>' : '')
    + '<div class="fc-greek">' + w.gr + '</div>'
    + '<div class="fc-pron">[' + w.kr + ']</div>'
    + '<div class="fc-hint">탭하면 뒤집혀요</div>';

  let back = '<div class="fc-back-greek">' + w.gr + ' [' + w.kr + ']</div>'
    + '<div class="fc-meaning">' + w.ko + '</div>';
  if (w.etymology) {
    back += '<div class="fc-sec-lbl">어원</div><p class="fc-ety">' + w.etymology + '</p>';
  }
  if (w.pun) {
    back += '<div class="fc-sec-lbl">소리 연상 <span style="font-weight:400;letter-spacing:0">(암기용 말장난, 학술 출처 없음)</span></div>'
      + '<p class="fc-pun">' + w.pun + '</p>';
  }
  if (!w.etymology && !w.pun) back += '<p class="fc-none">이 단어는 아직 연상 자료가 없어요.</p>';
  fcBack.innerHTML = back;
  fcBack.scrollTop = 0;

  fcPrev.disabled = cardIdx === 0;
  fcNext.disabled = cardIdx === cardDeck.length - 1;
  fcMark.classList.toggle('on', marked);
  fcMark.textContent = (marked ? '★' : '☆') + ' 다시 볼 단어';
}

function moveCard(delta) {
  const next = cardIdx + delta;
  if (next < 0 || next >= cardDeck.length) return;
  cardIdx = next;
  resetFlip();
  renderCard();
}

document.getElementById('cardMenuBtn').addEventListener('click', () => {
  cardWeeks = selectedWeeks();
  if (cardWeeks.length === 0) {
    cardErr.textContent = '주차를 하나 이상 선택해주세요.';
    cardErr.style.display = 'block';
    return;
  }
  cardErr.style.display = 'none';
  cardIdx = 0;
  fcReviewOnly.checked = false;
  buildDeck();
  resetFlip();
  menuScreen.style.display = 'none';
  cardScreen.style.display = 'block';
  window.scrollTo(0, 0);
  renderCard();
});
document.getElementById('cardBackBtn').addEventListener('click', () => {
  cardScreen.style.display = 'none';
  menuScreen.style.display = 'block';
  window.scrollTo(0, 0);
});
flashcard.addEventListener('click', () => flashcard.classList.toggle('flipped'));
fcPrev.addEventListener('click', () => moveCard(-1));
fcNext.addEventListener('click', () => moveCard(1));
fcMark.addEventListener('click', () => {
  const w = cardDeck[cardIdx];
  if (!w) return;
  if (reviewSet.has(w.gr)) reviewSet.delete(w.gr); else reviewSet.add(w.gr);
  saveReview(reviewSet);
  // "다시 볼 단어만" 보기에서 표시를 풀면 목록에서 빠진다
  if (fcReviewOnly.checked) { buildDeck(); resetFlip(); }
  renderCard();
});
fcReviewOnly.addEventListener('change', () => {
  cardIdx = 0;
  buildDeck();
  resetFlip();
  renderCard();
});
document.addEventListener('keydown', e => {
  if (cardScreen.style.display === 'none') return;
  if (e.key === 'ArrowLeft') moveCard(-1);
  else if (e.key === 'ArrowRight') moveCard(1);
  else if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('button, input, label')) {
    e.preventDefault(); flashcard.classList.toggle('flipped');
  }
});
</script>
</body>
